[workspace]
resolver = "3"
members = ["crates/*", "plugins/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/ansabic/MiteFX"
authors = ["MiteFX contributors"]

[workspace.dependencies]
mite-dsp = { path = "crates/mite-dsp" }
mite-core = { path = "crates/mite-core" }
mite-ui = { path = "crates/mite-ui" }
mite-plugin = { path = "crates/mite-plugin" }
mite-ara = { path = "crates/mite-ara" }

# nih-plug has no crates.io releases. We pin our fork's `mitefx` branch: upstream de42101 plus
# two CLAP state fixes (untrusted length prefix; value rescan after state load), host->plugin
# GUI resizing for CLAP and VST3, CLAP latency changes reported only from activate(), the
# CLAP track-info extension, and CLAP hooks for extra factories and extensions (ARA). See
# https://github.com/ansabic/nih-plug/commits/mitefx. Only `crates/mite-plugin` and `plugins/*`
# may use it.
nih_plug = { git = "https://github.com/ansabic/nih-plug", rev = "190d4dd9e9534cdec166523da77e79dabbd97f75", features = ["assert_process_allocs"] }
# CLAP's C API, for the test host in mite-plugin (the revision nih-plug uses).
clap-sys = { git = "https://github.com/micahrj/clap-sys.git", rev = "25d7f53fdb6363ad63fbd80049cb7a42a97ac156" }
nih_plug_xtask = { git = "https://github.com/ansabic/nih-plug", rev = "190d4dd9e9534cdec166523da77e79dabbd97f75" }

baseview = "0.4.1"
keyboard-types = "0.8.3"
parley = { version = "0.12", default-features = false, features = ["std"] }
pollster = "0.4"
raw-window-handle = "0.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reference audio for EQ Match (MPL-2.0); the file dialog (MIT).
symphonia = { version = "0.5.4", features = ["mp3", "aac", "isomp4", "alac", "aiff"] }
rfd = "0.15"
vello = "0.11"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
