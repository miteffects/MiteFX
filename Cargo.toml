[workspace]
resolver = "3"
members = ["crates/*", "plugins/*", "plugins/*/core", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/miteffects/MiteFX"
authors = ["MiteFX contributors"]

[workspace.dependencies]
mite-dsp = { path = "crates/mite-dsp" }
mite-core = { path = "crates/mite-core" }
mite-ui = { path = "crates/mite-ui" }
mite-plugin = { path = "crates/mite-plugin" }
mite-ara = { path = "crates/mite-ara" }

# nih-plug has no crates.io releases. We pin our fork's `mitefx` branch: upstream de42101 plus
# two CLAP state fixes (untrusted length prefix; value rescan after state load), host->plugin
# GUI resizing for CLAP and VST3, CLAP latency changes reported only from activate(), the
# CLAP track-info extension, CLAP hooks for extra factories and extensions, VST3 ARA entry
# points, and CLAP in-place port pairs only where the layouts match (mono in, stereo out). See
# https://github.com/miteffects/nih-plug/commits/mitefx. Only `crates/mite-plugin` and `plugins/*`
# may use it.
nih_plug = { git = "https://github.com/miteffects/nih-plug", rev = "0925e449f0203144110128a78beaf69bdbfa0228", features = ["assert_process_allocs"] }
# CLAP's C API, for the test host in mite-plugin (the revision nih-plug uses).
clap-sys = { git = "https://github.com/micahrj/clap-sys.git", rev = "25d7f53fdb6363ad63fbd80049cb7a42a97ac156" }
nih_plug_xtask = { git = "https://github.com/miteffects/nih-plug", rev = "0925e449f0203144110128a78beaf69bdbfa0228" }

baseview = "0.4.1"
keyboard-types = "0.8.3"
parley = { version = "0.12", default-features = false, features = ["std"] }
pollster = "0.4"
raw-window-handle = "0.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reference audio for EQ Match (MPL-2.0); the file dialog (MIT).
symphonia = { version = "0.5.4", features = ["mp3", "aac", "isomp4", "alac", "aiff"] }
rfd = "0.15"
vello = "0.11"

# Debug builds (tests, the allocation guard) kept small (2026-11-10: target/debug had grown to
# 238 GB): line numbers only for backtraces, dependencies without debug info, and no incremental
# cache (it keeps stale copies of every crate it ever built).
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = "symbols"

# Tests: release optimisation (DSP timings and figures stay realistic), without LTO (it does not
# change floating-point results) and incremental, so an edit rebuilds in seconds, not minutes.
# `cargo test --profile fasttest --lib --tests -p <crate>`; bundles still build with `release`.
[profile.fasttest]
inherits = "release"
lto = false
incremental = true
strip = "none"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
