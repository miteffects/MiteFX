[package]
name = "mite_rig"
description = "Mite Rig: a guitar and bass signal chain (NAM captures, cabinets, effects, parallel lanes) with TONE3000"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
mite-core.workspace = true
mite-dsp.workspace = true
mite-nam = { path = "../../crates/mite-nam" }
mite-plugin.workspace = true
mite-ui.workspace = true
nih_plug.workspace = true
serde.workspace = true
serde_json.workspace = true
symphonia.workspace = true
# TONE3000's API (HTTPS with rustls, no system OpenSSL), on worker threads only.
ureq = "2.12"
# TONE3000's cover images.
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.18"

[dev-dependencies]
# The allocation guard nih-plug wraps `process()` in (same source as nih-plug's, so it is the same
# crate and the same global allocator): tests run engine blocks inside it.
assert_no_alloc = { git = "https://github.com/robbert-vdh/rust-assert-no-alloc.git", branch = "feature/nested-permit-forbid" }
baseview.workspace = true
png = "0.18"
