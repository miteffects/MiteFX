[package]
name = "mite_cut"
description = "Mite Cut: drum hits found across the kit's tracks, the silences between them cut (ARA)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
mite-ara.workspace = true
mite-core.workspace = true
mite-dsp.workspace = true
mite-plugin.workspace = true
mite-ui.workspace = true
nih_plug.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The allocation guard nih-plug wraps `process()` in (same source as nih-plug's).
assert_no_alloc = { git = "https://github.com/robbert-vdh/rust-assert-no-alloc.git", branch = "feature/nested-permit-forbid" }
png = "0.18"
