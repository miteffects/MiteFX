name: Website

# The site in site/ (plain HTML, no build step) published with GitHub Pages.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Every asset link carries the commit, so browsers fetch a new deploy at once
      # (Pages lets them cache files for 10 minutes).
      - name: Stamp the version
        run: sed -i "s/__V__/${GITHUB_SHA::8}/g" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
