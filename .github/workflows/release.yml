name: Release

# Every push to main builds every plugin on Windows, macOS (universal) and Linux and replaces the
# downloads of the current version's release (v + workspace version in Cargo.toml; the tag moves
# to the new commit). A newer push cancels a build still running. Bump the workspace version to
# start a new release. The website links to releases/latest/download/.

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "docs/**", "**.md", ".github/workflows/pages.yml", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PACKAGES: -p mite_gain -p mite_eq -p mite_comp -p mite_shape -p mite_sat -p mite_limit -p mite_gate -p mite_multiband -p mite_verb -p mite_delay -p mite_tuner -p mite_double -p mite_deess -p mite_denoise -p mite_analyzer -p mite_rig -p mite_mod -p mite_pitch

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS
          - os: ubuntu-24.04
            platform: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-xcb-dev libxcursor-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl-dev libasound2-dev libjack-jackd2-dev
      - name: Bundle (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo xtask bundle-universal $PACKAGES --release
          # Apple Silicon loads no unsigned code: an ad-hoc signature (no developer ID).
          for b in target/bundled/*.vst3 target/bundled/*.clap; do codesign --force --deep --sign - "$b"; done
      - name: Bundle
        if: runner.os != 'macOS'
        shell: bash
        run: cargo xtask bundle $PACKAGES --release
      - name: Package
        shell: bash
        run: |
          VERSION="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p "MiteFX/VST3" "MiteFX/CLAP"
          cp -R target/bundled/*.vst3 "MiteFX/VST3/"
          cp -R target/bundled/*.clap "MiteFX/CLAP/"
          cp "packaging/INSTALL-${{ matrix.platform }}.txt" "MiteFX/INSTALL.txt"
          cp LICENSE "MiteFX/LICENSE.txt"
          case "${{ matrix.platform }}" in
            Windows) 7z a -tzip "MiteFX-Windows.zip" MiteFX > /dev/null ;;
            macOS)   ditto -c -k --keepParent MiteFX "MiteFX-macOS.zip" ;;
            Linux)
              cp packaging/linux/install.sh MiteFX/
              chmod +x MiteFX/install.sh
              tar -czf "MiteFX-Linux.tar.gz" MiteFX ;;
          esac

      # Windows: an installer (Inno Setup) that puts VST3 and CLAP in Common Files, with an uninstaller.
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DSrc=$PWD\MiteFX" "/DVersion=$env:VERSION" "/O$PWD" packaging\windows\MiteFX.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # macOS: a .pkg into /Library/Audio/Plug-Ins. Files the Installer puts in place carry no
      # quarantine, so nothing to clear by hand. Bundles are pinned (not relocatable) so an update
      # never lands in a copy elsewhere.
      - name: Installer (macOS)
        if: runner.os == 'macOS'
        run: |
          for kind in vst3 clap; do
            dir=$([ $kind = vst3 ] && echo VST3 || echo CLAP)
            pkgbuild --analyze --root "MiteFX/$dir" "$kind.plist"
            n=$(/usr/libexec/PlistBuddy -c "Print" "$kind.plist" | grep -c "RootRelativeBundlePath" || true)
            for ((i = 0; i < n; i++)); do /usr/libexec/PlistBuddy -c "Set :$i:BundleIsRelocatable false" "$kind.plist"; done
            pkgbuild --root "MiteFX/$dir" --component-plist "$kind.plist" --install-location "/Library/Audio/Plug-Ins/$dir" \
              --identifier "io.github.miteffects.mitefx.$kind" --version "$VERSION" "$kind.pkg"
          done
          mkdir -p res
          cp LICENSE res/LICENSE.txt
          sed "s/__VERSION__/$VERSION/g" packaging/macos/welcome.html > res/welcome.html
          sed "s/__VERSION__/$VERSION/g" packaging/macos/distribution.xml > distribution.xml
          productbuild --distribution distribution.xml --resources res --package-path . MiteFX-macOS.pkg
          pkgutil --payload-files MiteFX-macOS.pkg | grep -c "\.clap$\|\.vst3$" || true

      # Linux: a .deb for Debian and Ubuntu, into /usr/lib/vst3 and /usr/lib/clap.
      - name: Package (.deb)
        if: runner.os == 'Linux'
        run: |
          root=deb/mitefx
          mkdir -p "$root/DEBIAN" "$root/usr/lib/vst3" "$root/usr/lib/clap" "$root/usr/share/doc/mitefx"
          cp -R MiteFX/VST3/* "$root/usr/lib/vst3/"
          cp MiteFX/CLAP/* "$root/usr/lib/clap/"
          cp LICENSE "$root/usr/share/doc/mitefx/copyright"
          cat > "$root/DEBIAN/control" <<CONTROL
          Package: mitefx
          Version: $VERSION
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: MiteFX <https://github.com/miteffects/MiteFX/issues>
          Homepage: https://miteffects.github.io/MiteFX/
          Depends: libc6, libx11-6, libx11-xcb1, libxcb1, libxcursor1, libgl1
          Recommends: libvulkan1
          Description: free, open-source audio plugins (VST3 and CLAP)
           Eighteen plugins for mixing, mastering and guitar: EQ, compressors, limiter,
           saturation, reverb, delay, pitch editor, tuner, analyzer and a guitar rig.
          CONTROL
          sed -i 's/^          //' "$root/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$root" MiteFX-Linux.deb
          dpkg-deb --info MiteFX-Linux.deb | head -8

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            MiteFX-${{ matrix.platform }}.*
            MiteFX-${{ matrix.platform }}-Setup.exe

  publish:
    name: Publish the release
    needs: build
    # Publish what built: a platform GitHub had no machine for (macOS runners queue for long)
    # keeps its previous download. A newer push cancels the run, and then nothing is published.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Create or replace the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la MiteFX-* || { echo "nothing built"; exit 1; }
          TAG="v$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          echo "release $TAG at $GITHUB_SHA"
          # The tag follows main (a push made with GITHUB_TOKEN starts no workflow).
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" MiteFX-* --clobber
            gh release edit "$TAG" --notes-file packaging/RELEASE_NOTES.md
          else
            gh release create "$TAG" MiteFX-* --title "MiteFX $TAG" --target "$GITHUB_SHA" --notes-file packaging/RELEASE_NOTES.md
          fi
