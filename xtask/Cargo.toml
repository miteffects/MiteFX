[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "xtask"

[dependencies]
nih_plug_xtask.workspace = true
# `cargo xtask compare`: the analog prototypes and the FFT the measurements use.
mite-dsp.workspace = true
realfft = "3.5"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["sync"] }
