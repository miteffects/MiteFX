<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mite Shape — compact 640 × 400</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 640px; height: 400px; display: flex; flex-direction: column; background: {{c.win}}; color: {{c.hi}}; font-family: Manrope, system-ui, sans-serif; font-size: 12px; overflow: hidden">
<header style="height: 44px; flex: 0 0 44px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-bottom: 1px solid {{c.line}}">
<button aria-label="Mite Shape menu" style="height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 6px; background: transparent; border: none; border-radius: 6px">
<svg width="20" height="20" viewBox="0 0 32 32" fill="none" aria-hidden="true" style="overflow: visible"><path d="M16 11 C20.5 11 22 15 22 19 C22 24 19.5 28 16 28 C12.5 28 10 24 10 19 C10 15 11.5 11 16 11 Z" stroke="{{c.hi}}" stroke-width="1.8"></path><circle cx="16" cy="7.4" r="2.6" stroke="{{c.hi}}" stroke-width="1.8"></circle><path d="M11.5 23 L13.2 23 C14 23 14.2 15.5 15.4 15.5 C16.6 15.5 16.6 20.5 17.8 20.5 L20.5 20.5" stroke="{{c.accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 3px {{c.accent}})"></path></svg>
<span style="font-size: 13px; font-weight: 800">Shape</span>
</button>
<button aria-label="Preset Drum Punch, open the preset list" style="flex: 1; min-width: 0; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: {{c.ctl}}; border: 1px solid {{c.ctlB}}; border-radius: 6px; box-shadow: {{c.raised}}; text-align: left"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="4.2" stroke="{{c.mid}}" stroke-width="1.5"></circle><path d="M9.2 9.2 L12.5 12.5" stroke="{{c.mid}}" stroke-width="1.5" stroke-linecap="round"></path></svg><span style="flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Drum Punch</span></button>
<button aria-label="Snapshot A" aria-pressed="true" style="width: 32px; height: 32px; border-radius: 6px; font-weight: 700; background: {{c.accentSoft}}; border: 1px solid {{c.accent}}; color: {{c.accentText}}">A</button>
<button aria-label="Snapshot B" aria-pressed="false" style="width: 32px; height: 32px; border-radius: 6px; font-weight: 700; background: {{c.ctl}}; border: 1px solid {{c.ctlB}}; box-shadow: {{c.raised}}; color: {{c.mid}}">B</button>
<button aria-label="More: undo, redo, snapshots C and D, stereo, detector, help" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: {{c.ctl}}; border: 1px solid {{c.ctlB}}; border-radius: 6px; box-shadow: {{c.raised}}"><svg width="14" height="14" viewBox="0 0 14 14" fill="{{c.mid}}" aria-hidden="true"><circle cx="3" cy="7" r="1.4"></circle><circle cx="7" cy="7" r="1.4"></circle><circle cx="11" cy="7" r="1.4"></circle></svg></button>
</header>
<main style="position: relative; height: 308px; flex: 0 0 308px; background: {{c.disp}}; overflow: hidden">
<svg width="640" height="308" viewBox="0 0 640 308" style="position: absolute; left: 0; top: 0" role="img" aria-label="History with signed shaping gain for band 2, crossover strip with three bands, meters">
<defs>
<filter id="cg" filterUnits="userSpaceOnUse" x="-10" y="-10" width="660" height="330"><feGaussianBlur stdDeviation="2.2" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
</defs>
<path d="{{grid}}" stroke="{{c.gridMinor}}" stroke-width="1" fill="none"></path>
<path d="M0 112.5 H560" stroke="{{c.line}}" stroke-width="1"></path>
<path d="M0 156 H560" stroke="{{c.zero}}" stroke-width="1.2"></path>
<path d="{{inFill}}" fill="{{c.pre}}" fill-opacity="0.16"></path>
<path d="{{outLine}}" stroke="{{c.curve}}" stroke-width="1.5" fill="none" filter="url(#cg)"></path>
<path d="{{upL}}" fill="{{c.up}}" fill-opacity="0.28"></path>
<path d="{{upS}}" fill="{{c.up}}" fill-opacity="0.7" filter="url(#cg)"></path>
<path d="{{dnL}}" fill="{{c.gr}}" fill-opacity="0.28"></path>
<path d="{{dnS}}" fill="{{c.gr}}" fill-opacity="0.7" filter="url(#cg)"></path>
<path d="{{upE}}" stroke="{{c.up}}" stroke-width="1.3" fill="none"></path>
<path d="{{dnE}}" stroke="{{c.gr}}" stroke-width="1.3" fill="none"></path>
<path d="{{ticks}}" stroke="{{c.accent}}" stroke-width="2" stroke-linecap="round" filter="url(#cg)"></path>
<rect x="0" y="200" width="560" height="40" fill="{{c.well}}"></rect>
<path d="M0 200.5 H560 M0 239.5 H560" stroke="{{c.wellB}}"></path>
<rect x="{{rg.r0.x}}" y="200" width="{{rg.r0.w}}" height="40" fill="{{c.accent}}" fill-opacity="{{rg.r0.op}}"></rect>
<rect x="{{rg.r1.x}}" y="200" width="{{rg.r1.w}}" height="40" fill="{{c.accent}}" fill-opacity="{{rg.r1.op}}"></rect>
<rect x="{{rg.r2.x}}" y="200" width="{{rg.r2.w}}" height="40" fill="{{c.accent}}" fill-opacity="{{rg.r2.op}}"></rect>
<path d="{{spec}}" stroke="{{c.pre}}" stroke-opacity="0.6" stroke-width="1" fill="none"></path>
<path d="{{outSpec}}" stroke="{{c.curve}}" stroke-width="1.4" fill="none" filter="url(#cg)"></path>
<path d="{{xl}}" stroke="{{c.accent}}" stroke-opacity="0.75" stroke-width="1.5"></path>
<path d="M580 286 V14 M590 286 V14 M616 286 V14 M626 286 V14" stroke="{{c.meterOff}}" stroke-width="6" stroke-dasharray="2 2"></path>
<path d="{{mIn}}" stroke="{{c.pre}}" stroke-width="6" stroke-dasharray="2 2"></path>
<path d="{{mOut}}" stroke="{{c.curve}}" stroke-width="6" stroke-dasharray="2 2" filter="url(#cg)"></path>
</svg>
<sc-for list="{{grips}}" as="g" hint-placeholder-count="2">
<button aria-label="{{g.aria}}" style="position: absolute; left: {{g.x}}px; top: 204px; width: 32px; height: 32px; padding: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 24px; box-sizing: border-box; border-radius: 6px; background: {{c.disp}}; border: 1.5px solid {{c.accent}}; box-shadow: 0 0 8px {{c.accentSoft}}"></span></button>
</sc-for>
<sc-for list="{{badges}}" as="b" hint-placeholder-count="3">
<span aria-hidden="true" style="position: absolute; left: {{b.x}}px; top: 205px; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; background: {{b.bg}}; color: {{b.fg}}; box-shadow: {{b.sh}}">{{b.n}}</span>
</sc-for>
<span aria-hidden="true" style="position: absolute; left: 580px; top: 290px; font-size: 8px; font-weight: 700; letter-spacing: 0.06em; color: {{c.lo}}">IN&#160;&#160;&#160;&#160;OUT</span>
<div style="position: absolute; left: 8px; right: 84px; bottom: 8px; height: 50px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 8px; background: {{c.glass}}; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid {{c.glassB}}; border-radius: 12px; box-shadow: {{c.glassSh}}">
<span style="width: 18px; height: 18px; flex: 0 0 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; background: {{c.accent}}; color: {{c.nodeInk}}; box-shadow: 0 0 8px {{c.accent}}">2</span>
<div role="img" aria-label="Band 2 transient scope: attack +3.0 dB, sustain −6.0 dB, 40 ms" style="width: 92px; height: 38px; flex: 0 0 92px; border-radius: 6px; background: {{c.well}}; border: 1px solid {{c.wellB}}; overflow: hidden">
<svg width="92" height="38" viewBox="0 0 92 38" aria-hidden="true"><path d="{{scTrans}}" fill="{{c.accent}}" fill-opacity="0.14"></path><path d="M0 20 H92" stroke="{{c.zero}}"></path><path d="{{scUp}}" fill="{{c.up}}" fill-opacity="0.6"></path><path d="{{scDn}}" fill="{{c.gr}}" fill-opacity="0.35"></path><path d="{{scG}}" stroke="{{c.curve}}" stroke-width="1.6" fill="none"></path></svg>
</div>
<sc-for list="{{fields}}" as="f" hint-placeholder-count="3">
<button aria-label="{{f.aria}}" style="height: 34px; padding: 0 7px; display: flex; flex-direction: column; justify-content: center; gap: 1px; background: {{c.well}}; border: 1px solid {{c.wellB}}; border-radius: 6px; box-shadow: {{c.wellSh}}; text-align: left"><span style="font-size: 8px; font-weight: 700; letter-spacing: 0.06em; color: {{c.lo}}">{{f.k}}</span><span style="font-feature-settings: 'tnum' 1; font-weight: 600; color: {{f.c}}">{{f.v}}</span></button>
</sc-for>
<div style="flex: 1"></div>
<button aria-label="Open the full band panel" style="height: 32px; padding: 0 10px; background: {{c.pCtl}}; border: 1px solid {{c.pCtlB}}; border-radius: 6px; box-shadow: {{c.raised}}; font-weight: 700">More</button>
</div>
</main>
<footer style="height: 48px; flex: 0 0 48px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-top: 1px solid {{c.line}}">
<sc-for list="{{icons}}" as="i" hint-placeholder-count="4">
<button aria-label="{{i.aria}}" aria-pressed="{{i.on}}" style="width: 38px; height: 32px; display: flex; align-items: center; justify-content: center; background: {{i.bg}}; border: 1px solid {{i.b}}; border-radius: 6px; box-shadow: {{i.sh}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="{{i.d}}" stroke="{{i.fg}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</sc-for>
<div style="flex: 1"></div>
<sc-for list="{{dials}}" as="d" hint-placeholder-count="2">
<button aria-label="{{d.aria}}" style="height: 40px; display: flex; align-items: center; gap: 5px; padding: 0 2px; background: transparent; border: none">
<svg width="30" height="30" viewBox="0 0 64 64" fill="none" aria-hidden="true" style="overflow: visible"><path d="{{d.dim}}" stroke="{{c.tickOff}}" stroke-width="4" stroke-linecap="round"></path><path d="{{d.lit}}" stroke="{{c.accent}}" stroke-width="4" stroke-linecap="round" style="filter: drop-shadow(0 0 2px {{c.accent}})"></path><circle cx="32" cy="32" r="17" fill="{{c.disc}}" stroke="{{c.discB}}" stroke-width="2"></circle><path d="{{d.ptr}}" stroke="{{c.needle}}" stroke-width="4.5" stroke-linecap="round" style="filter: drop-shadow(0 0 3px {{c.accent}})"></path></svg>
<span style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px"><span style="font-size: 9px; font-weight: 700; letter-spacing: 0.08em; color: {{c.lo}}">{{d.label}}</span><span style="font-feature-settings: 'tnum' 1; font-weight: 600; font-size: 11px">{{d.v}}</span></span>
</button>
</sc-for>
</footer>
</div>
</x-dc>
