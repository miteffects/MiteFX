<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mite Comp — compact 640 × 400</title>
<script src="./support.js"></script>
</head>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 640px; height: 400px; display: flex; flex-direction: column; background: {{c.win}}; color: {{c.hi}}; font-family: Manrope, system-ui, sans-serif; font-size: 12px; overflow: hidden">
<header style="height: 44px; flex: 0 0 44px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-bottom: 1px solid {{c.line}}">
<button aria-label="Mite Comp menu" style="height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 6px; background: transparent; border: none; border-radius: 6px">
<svg width="20" height="20" viewBox="0 0 32 32" fill="none" aria-hidden="true" style="overflow: visible"><path d="M16 11 C20.5 11 22 15 22 19 C22 24 19.5 28 16 28 C12.5 28 10 24 10 19 C10 15 11.5 11 16 11 Z" stroke="{{c.hi}}" stroke-width="1.8"></path><circle cx="16" cy="7.4" r="2.6" stroke="{{c.hi}}" stroke-width="1.8"></circle><path d="M12 24 L16 19.5 C17.2 18.2 18.4 17.8 20 17.4" stroke="{{c.accent}}" stroke-width="2" stroke-linecap="round" style="filter: drop-shadow(0 0 3px {{c.accent}})"></path></svg>
<span style="font-size: 13px; font-weight: 800">Comp</span>
</button>
<button aria-label="Preset Vocal Leveller, open the preset list" style="flex: 1; min-width: 0; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: {{c.ctl}}; border: 1px solid {{c.ctlB}}; border-radius: 6px; box-shadow: {{c.raised}}; text-align: left"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="4.2" stroke="{{c.mid}}" stroke-width="1.5"></circle><path d="M9.2 9.2 L12.5 12.5" stroke="{{c.mid}}" stroke-width="1.5" stroke-linecap="round"></path></svg><span style="flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Vocal Leveller</span></button>
<button aria-label="Snapshot A" aria-pressed="true" style="width: 32px; height: 32px; border-radius: 6px; font-weight: 700; background: {{c.accentSoft}}; border: 1px solid {{c.accent}}; color: {{c.accentText}}">A</button>
<button aria-label="Snapshot B" aria-pressed="false" style="width: 32px; height: 32px; border-radius: 6px; font-weight: 700; background: {{c.ctl}}; border: 1px solid {{c.ctlB}}; box-shadow: {{c.raised}}; color: {{c.mid}}">B</button>
<button aria-label="Sidechain" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: {{c.ctl}}; border: 1px solid {{c.ctlB}}; border-radius: 6px; box-shadow: {{c.raised}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7.5 15.5 a3.5 3.5 0 1 1 0.01 0 M10.5 13.5 L20 7 M17 9 L19 12 M14.5 10.7 L16 13" stroke="{{c.mid}}" stroke-width="1.7" stroke-linecap="round"></path></svg></button>
<button aria-label="More: undo, redo, snapshots C and D, stereo, detector settings, help" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: {{c.ctl}}; border: 1px solid {{c.ctlB}}; border-radius: 6px; box-shadow: {{c.raised}}"><svg width="14" height="14" viewBox="0 0 14 14" fill="{{c.mid}}" aria-hidden="true"><circle cx="3" cy="7" r="1.4"></circle><circle cx="7" cy="7" r="1.4"></circle><circle cx="11" cy="7" r="1.4"></circle></svg></button>
</header>
<main style="position: relative; height: 308px; flex: 0 0 308px; background: {{c.disp}}; overflow: hidden">

<defs>

<linearGradient id="cout" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{c.curve}}" stop-opacity="0.12"></stop><stop offset="1" stop-color="{{c.curve}}" stop-opacity="0.01"></stop></linearGradient>

<path d="{{meters}}" stroke="{{c.curve}}" stroke-width="6" stroke-dasharray="2 2"></path>
<path d="{{grMeter}}" stroke="{{c.gr}}" stroke-width="6" stroke-dasharray="2 2" filter="url(#cg)"></path>
</svg>
<button aria-label="Stage 1 threshold −18.0 dB, drag up or down" style="position: absolute; left: 530px; top: {{gripY}}px; width: 30px; height: 20px; padding: 0; border-radius: 10px; background: {{c.disp}}; border: 1.5px solid {{c.accent}}; font-size: 10px; font-weight: 800; color: {{c.accent}}">1</button>
<div role="img" aria-label="Transfer curve: one compress stage at −18 dB, 4 to 1" style="position: absolute; left: 392px; top: 10px; width: 132px; height: 132px; border-radius: 10px; background: {{c.glass}}; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid {{c.glassB}}; box-shadow: {{c.glassSh}}; overflow: hidden">
<svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true">
<path d="M6 126 L126 6" stroke="{{c.zero}}" stroke-width="1" stroke-dasharray="3 3"></path>
<path d="{{shade}}" fill="{{c.gr}}" fill-opacity="0.22"></path>
<path d="{{curve}}" stroke="{{c.curve}}" stroke-width="2" fill="none" style="filter: drop-shadow(0 0 4px {{c.curve}})"></path>
<circle cx="{{dot.x}}" cy="{{dot.y}}" r="4.5" fill="{{c.needle}}" style="filter: drop-shadow(0 0 5px {{c.accent}})"></circle>
<circle cx="{{node.x}}" cy="{{node.y}}" r="6" fill="{{c.accentSoft}}" stroke="{{c.accent}}" stroke-width="2"></circle>
</svg>
</div>
<span aria-hidden="true" style="position: absolute; left: 574px; top: 290px; font-size: 8px; font-weight: 700; letter-spacing: 0.06em; color: {{c.lo}}">IN GR OUT</span>
<div style="position: absolute; left: 8px; right: 84px; bottom: 8px; height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 10px; background: {{c.glass}}; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid {{c.glassB}}; border-radius: 12px; box-shadow: {{c.glassSh}}">
<span style="width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; background: {{c.accent}}; color: {{c.nodeInk}}; box-shadow: 0 0 8px {{c.accent}}">1</span>
<sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
<button aria-label="{{f.aria}}" style="height: 30px; padding: 0 7px; display: flex; align-items: center; gap: 5px; background: {{c.well}}; border: 1px solid {{c.wellB}}; border-radius: 6px; box-shadow: {{c.wellSh}}"><span style="font-size: 9px; font-weight: 700; letter-spacing: 0.06em; color: {{c.lo}}">{{f.k}}</span><span style="font-feature-settings: 'tnum' 1; font-weight: 600">{{f.v}}</span></button>
</sc-for>
<div style="flex: 1"></div>
<button aria-label="Open the full stage panel" style="height: 30px; padding: 0 10px; background: {{c.pCtl}}; border: 1px solid {{c.pCtlB}}; border-radius: 6px; box-shadow: {{c.raised}}; font-weight: 700">More</button>
</div>
</main>
<footer style="height: 48px; flex: 0 0 48px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-top: 1px solid {{c.line}}">
<sc-for list="{{icons}}" as="i" hint-placeholder-count="5">
<button aria-label="{{i.aria}}" aria-pressed="{{i.on}}" style="width: 38px; height: 32px; display: flex; align-items: center; justify-content: center; background: {{i.bg}}; border: 1px solid {{i.b}}; border-radius: 6px; box-shadow: {{i.sh}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="{{i.d}}" stroke="{{i.fg}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>

<div style="flex: 1"></div>
<sc-for list="{{dials}}" as="d" hint-placeholder-count="2">

</button>
</sc-for>
</footer>
</div>
