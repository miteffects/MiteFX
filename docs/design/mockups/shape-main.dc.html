<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mite Shape — main screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
.dial>span:first-child{transition:transform 140ms cubic-bezier(.2,0,0,1)}
.dial:hover>span:first-child{transform:scale(1.1)}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 760px; display: flex; flex-direction: column; background: {{th.win}}; color: {{th.hi}}; font-family: Manrope, system-ui, sans-serif; font-size: 12px; overflow: hidden">

<header style="height: 56px; flex: 0 0 56px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: {{th.win}}; border-bottom: 1px solid {{th.line}}">
<button aria-label="Mite Shape menu" style="height: 40px; display: flex; align-items: center; gap: 9px; padding: 0 12px 0 4px; background: transparent; border: none; border-radius: 8px">
<svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true" style="overflow: visible"><path d="M11.2 14 L6.5 9.5 M10.4 17 L4.5 15 M10.2 20.5 L4.5 21.5 M10.8 24 L6 28 M20.8 14 L25.5 9.5 M21.6 17 L27.5 15 M21.8 20.5 L27.5 21.5 M21.2 24 L26 28" stroke="{{th.lo}}" stroke-width="1.4" stroke-linecap="round"></path><path d="M16 11 C20.5 11 22 15 22 19 C22 24 19.5 28 16 28 C12.5 28 10 24 10 19 C10 15 11.5 11 16 11 Z" stroke="{{th.hi}}" stroke-width="1.6"></path><circle cx="16" cy="7.4" r="2.6" stroke="{{th.hi}}" stroke-width="1.6"></circle><path d="M11.5 23 L13.2 23 C14 23 14.2 15.5 15.4 15.5 C16.6 15.5 16.6 20.5 17.8 20.5 L20.5 20.5" stroke="{{th.accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 3px {{th.accent}})"></path></svg>
<span style="font-size: 16px; font-weight: 800; letter-spacing: -0.01em">Mite<span style="font-weight: 500; color: {{th.mid}}"> Shape</span></span>
</button>
<div style="width: 30px"></div>
<button aria-label="Previous preset" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: {{th.ctl}}; border: 1px solid {{th.ctlB}}; border-radius: 7px; box-shadow: {{th.raised}}"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M7.5 2.5 L4 6 L7.5 9.5" stroke="{{th.mid}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<button aria-label="Preset: {{presetName}}. Open the preset list" aria-expanded="{{isPresets}}" style="height: 36px; width: 300px; display: flex; align-items: center; gap: 9px; padding: 0 12px; background: {{presetBtn.bg}}; border: 1px solid {{presetBtn.b}}; border-radius: 7px; box-shadow: {{presetBtn.sh}}; text-align: left">
<svg width="15" height="15" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="4.2" stroke="{{th.mid}}" stroke-width="1.5"></circle><path d="M9.2 9.2 L12.5 12.5" stroke="{{th.mid}}" stroke-width="1.5" stroke-linecap="round"></path></svg>
<span style="flex: 1; font-size: 13px; font-weight: 600; color: {{th.hi}}">{{presetName}}<span style="color: {{th.accent}}; font-weight: 800">{{presetDirty}}</span></span>
</button>
<button aria-label="Next preset" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: {{th.ctl}}; border: 1px solid {{th.ctlB}}; border-radius: 7px; box-shadow: {{th.raised}}"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M4.5 2.5 L8 6 L4.5 9.5" stroke="{{th.mid}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<div style="width: 18px"></div>
<button aria-label="Undo" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: {{th.ctl}}; border: 1px solid {{th.ctlB}}; border-radius: 7px; box-shadow: {{th.raised}}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5.5 3.5 L2.5 6.5 L5.5 9.5" stroke="{{th.mid}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3 6.5 H9.5 A3.8 3.8 0 0 1 9.5 14 H7" stroke="{{th.mid}}" stroke-width="1.5" stroke-linecap="round"></path></svg></button>
<button aria-label="Redo, nothing to redo" disabled style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: {{th.ctl}}; border: 1px solid {{th.ctlB}}; border-radius: 7px; box-shadow: {{th.raised}}; cursor: default"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10.5 3.5 L13.5 6.5 L10.5 9.5" stroke="{{th.dis}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M13 6.5 H6.5 A3.8 3.8 0 0 0 6.5 14 H9" stroke="{{th.dis}}" stroke-width="1.5" stroke-linecap="round"></path></svg></button>
<div style="width: 18px"></div>
<div role="group" aria-label="Snapshots — drag a letter onto another to copy it" style="display: flex; gap: 8px">
<sc-for list="{{snaps}}" as="s" hint-placeholder-count="4">
<button aria-label="Snapshot {{s.k}}" aria-pressed="{{s.on}}" onClick="{{s.pick}}" style="width: 36px; height: 36px; border-radius: 7px; font-weight: 700; font-size: 13px; background: {{s.bg}}; border: 1px solid {{s.b}}; color: {{s.fg}}; box-shadow: {{s.sh}}">{{s.k}}</button>
</sc-for>
</div>
<div style="width: 26px"></div>
<sc-for list="{{headBtns}}" as="h" hint-placeholder-count="2">
<button aria-label="{{h.aria}}" aria-pressed="{{h.on}}" style="width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; background: {{h.bg}}; border: 1px solid {{h.b}}; border-radius: 7px; box-shadow: {{h.sh}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="overflow: visible"><path d="{{h.d}}" stroke="{{h.fg}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="filter: {{h.glow}}"></path></svg></button>
</sc-for>
</header>

<main style="position: relative; height: 620px; flex: 0 0 620px; background: {{th.disp}}; overflow: hidden; box-shadow: {{listenFrame}}">
<svg width="1280" height="620" viewBox="0 0 1280 620" style="position: absolute; left: 0; top: 0" role="img" aria-label="{{displayAria}}">
<defs>
<linearGradient id="outFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{outColor}}" stop-opacity="{{outFillA}}"></stop><stop offset="1" stop-color="{{outColor}}" stop-opacity="0.01"></stop></linearGradient>
<linearGradient id="softBand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{th.accent}}" stop-opacity="0.16"></stop><stop offset="1" stop-color="{{th.accent}}" stop-opacity="0"></stop></linearGradient>
<pattern id="upDots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="{{th.sem.up}}"></circle></pattern>
<pattern id="muteHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="{{th.lo}}" fill-opacity="0.30"></rect></pattern>
<filter id="glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="1320" height="660"><feGaussianBlur stdDeviation="5" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
<filter id="sglow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="1320" height="660"><feGaussianBlur stdDeviation="2.4" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
</defs>
<path d="{{hGrid}}" stroke="{{th.gridMinor}}" stroke-width="1" fill="none"></path>
<path d="{{laneSep}}" stroke="{{th.line}}" stroke-width="1"></path>
<path d="{{zeroLine}}" stroke="{{th.zero}}" stroke-width="1.2"></path>
<path d="{{inFill}}" fill="{{th.pre}}" fill-opacity="0.16"></path>
<path d="{{inLine}}" stroke="{{th.pre}}" stroke-opacity="0.55" stroke-width="1" fill="none"></path>
<path d="{{clipFill}}" fill="{{th.sem.gr}}" fill-opacity="0.55"></path>
<path d="{{outFillP}}" fill="url(#outFill)"></path>
<path d="{{outLine}}" stroke="{{outColor}}" stroke-width="1.6" fill="none" filter="url(#sglow)"></path>
<path d="{{otherGain}}" stroke="{{th.lo}}" stroke-opacity="0.7" stroke-width="1.2" fill="none"></path>
<path d="{{upLight}}" fill="{{th.sem.up}}" fill-opacity="0.28"></path>
<path d="{{upLight}}" fill="{{upPattern}}" fill-opacity="0.6"></path>
<path d="{{upSolid}}" fill="{{th.sem.up}}" fill-opacity="0.70" filter="url(#sglow)"></path>
<path d="{{dnLight}}" fill="{{th.sem.gr}}" fill-opacity="0.28"></path>
<path d="{{dnSolid}}" fill="{{th.sem.gr}}" fill-opacity="0.70" filter="url(#sglow)"></path>
<path d="{{upEdge}}" stroke="{{th.sem.up}}" stroke-width="1.5" fill="none"></path>
<path d="{{dnEdge}}" stroke="{{th.sem.gr}}" stroke-width="1.5" fill="none"></path>
<path d="{{gainEdge2}}" stroke="{{th.hi}}" stroke-opacity="0.85" stroke-width="1.4" stroke-dasharray="4 3" fill="none"></path>
<path d="{{hitTicks}}" stroke="{{th.accent}}" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#sglow)"></path>
<path d="{{ceilBand}}" fill="url(#softBand)"></path>
<path d="{{ceilLine}}" stroke="{{th.accent}}" stroke-width="1.5" fill="none" filter="url(#sglow)"></path>
<path d="M1180.5 0 V620" stroke="{{th.line}}" stroke-width="1"></path>

<rect x="0" y="{{rail.y}}" width="1180" height="{{rail.h}}" fill="{{th.well}}"></rect>
<path d="{{rail.edges}}" stroke="{{th.wellB}}" stroke-width="1"></path>
<path d="{{rail.grid}}" stroke="{{th.gridMinor}}" stroke-width="1" fill="none"></path>
<rect x="{{rg.r0.x}}" y="{{rail.y}}" width="{{rg.r0.w}}" height="{{rail.h}}" fill="{{rg.r0.fill}}" fill-opacity="{{rg.r0.op}}" stroke="{{rg.r0.stroke}}" stroke-width="1.5" stroke-dasharray="4 3"></rect>
<rect x="{{rg.r0.x}}" y="{{rail.y}}" width="{{rg.r0.w}}" height="{{rail.h}}" fill="{{rg.r0.hatch}}"></rect>
<rect x="{{rg.r1.x}}" y="{{rail.y}}" width="{{rg.r1.w}}" height="{{rail.h}}" fill="{{rg.r1.fill}}" fill-opacity="{{rg.r1.op}}" stroke="{{rg.r1.stroke}}" stroke-width="1.5" stroke-dasharray="4 3"></rect>
<rect x="{{rg.r1.x}}" y="{{rail.y}}" width="{{rg.r1.w}}" height="{{rail.h}}" fill="{{rg.r1.hatch}}"></rect>
<rect x="{{rg.r2.x}}" y="{{rail.y}}" width="{{rg.r2.w}}" height="{{rail.h}}" fill="{{rg.r2.fill}}" fill-opacity="{{rg.r2.op}}" stroke="{{rg.r2.stroke}}" stroke-width="1.5" stroke-dasharray="4 3"></rect>
<rect x="{{rg.r2.x}}" y="{{rail.y}}" width="{{rg.r2.w}}" height="{{rail.h}}" fill="{{rg.r2.hatch}}"></rect>
<rect x="{{rg.r3.x}}" y="{{rail.y}}" width="{{rg.r3.w}}" height="{{rail.h}}" fill="{{rg.r3.fill}}" fill-opacity="{{rg.r3.op}}" stroke="{{rg.r3.stroke}}" stroke-width="1.5" stroke-dasharray="4 3"></rect>
<rect x="{{rg.r3.x}}" y="{{rail.y}}" width="{{rg.r3.w}}" height="{{rail.h}}" fill="{{rg.r3.hatch}}"></rect>
<rect x="{{rg.r4.x}}" y="{{rail.y}}" width="{{rg.r4.w}}" height="{{rail.h}}" fill="{{rg.r4.fill}}" fill-opacity="{{rg.r4.op}}" stroke="{{rg.r4.stroke}}" stroke-width="1.5" stroke-dasharray="4 3"></rect>
<rect x="{{rg.r4.x}}" y="{{rail.y}}" width="{{rg.r4.w}}" height="{{rail.h}}" fill="{{rg.r4.hatch}}"></rect>
<path d="{{rail.specFill}}" fill="{{th.pre}}" fill-opacity="{{rail.specA}}"></path>
<path d="{{rail.spec}}" stroke="{{th.pre}}" stroke-opacity="0.6" stroke-width="1" fill="none"></path>
<path d="{{rail.out}}" stroke="{{th.curve}}" stroke-width="1.6" fill="none" filter="url(#sglow)"></path>
<path d="{{rail.xLines}}" stroke="{{th.accent}}" stroke-width="1.5" stroke-opacity="0.75" fill="none"></path>
<path d="{{rail.ghostLines}}" stroke="{{th.accent}}" stroke-width="1.5" stroke-dasharray="4 3" fill="none"></path>
<path d="{{fn.f0.d}}" fill="{{th.accent}}" fill-opacity="{{fn.f0.op}}" stroke="{{th.accent}}" stroke-opacity="{{fn.f0.sop}}" stroke-width="1"></path>
<path d="{{fn.f1.d}}" fill="{{th.accent}}" fill-opacity="{{fn.f1.op}}" stroke="{{th.accent}}" stroke-opacity="{{fn.f1.sop}}" stroke-width="1"></path>
<path d="{{fn.f2.d}}" fill="{{th.accent}}" fill-opacity="{{fn.f2.op}}" stroke="{{th.accent}}" stroke-opacity="{{fn.f2.sop}}" stroke-width="1"></path>
<path d="{{fn.f3.d}}" fill="{{th.accent}}" fill-opacity="{{fn.f3.op}}" stroke="{{th.accent}}" stroke-opacity="{{fn.f3.sop}}" stroke-width="1"></path>
<path d="{{fn.f4.d}}" fill="{{th.accent}}" fill-opacity="{{fn.f4.op}}" stroke="{{th.accent}}" stroke-opacity="{{fn.f4.sop}}" stroke-width="1"></path>

<path d="{{meterWells}}" fill="{{th.meterWell}}" stroke="{{th.wellB}}"></path>
<path d="M1203 588 V24 M1213 588 V24 M1245 24 V588 M1255 24 V588" stroke="{{th.meterOff}}" stroke-width="8" stroke-dasharray="2 2"></path>
<path d="{{mIn}}" stroke="{{th.pre}}" stroke-width="8" stroke-dasharray="2 2"></path>
<path d="{{mOut}}" stroke="{{th.curve}}" stroke-width="8" stroke-dasharray="2 2" filter="url(#sglow)"></path>
</svg>

<sc-for list="{{dbLabels}}" as="l" hint-placeholder-count="6">
<span aria-hidden="true" style="position: absolute; left: 1148px; top: {{l.y}}px; width: 28px; text-align: right; font-feature-settings: 'tnum' 1; font-weight: 600; font-size: 10px; color: {{l.c}}; text-shadow: 0 0 3px {{th.disp}}, 0 0 3px {{th.disp}}">{{l.t}}</span>
</sc-for>
<sc-for list="{{fLabels}}" as="l" hint-placeholder-count="3">
<span aria-hidden="true" style="position: absolute; left: {{l.x}}px; top: {{l.y}}px; font-feature-settings: 'tnum' 1; font-weight: 600; font-size: 10px; color: {{th.lo}}">{{l.t}}</span>
</sc-for>
<span aria-hidden="true" style="position: absolute; left: 1196px; top: 596px; width: 26px; text-align: center; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; color: {{th.lo}}">IN</span>
<span aria-hidden="true" style="position: absolute; left: 1238px; top: 596px; width: 26px; text-align: center; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; color: {{th.lo}}">OUT</span>

<sc-for list="{{xGrips}}" as="g" hint-placeholder-count="2">
<button aria-label="{{g.aria}}" style="position: absolute; left: {{g.x}}px; top: {{g.y}}px; width: 32px; height: 32px; padding: 0; background: transparent; border: none; display: flex; align-items: center; justify-content: center; opacity: {{g.op}}">
<span style="width: 14px; height: 28px; box-sizing: border-box; border-radius: 7px; background: {{g.bg}}; border: 1.5px {{g.bs}} {{g.c}}; box-shadow: {{g.sh}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><span style="width: 4px; height: 1.5px; background: {{g.ink}}; border-radius: 1px"></span><span style="width: 4px; height: 1.5px; background: {{g.ink}}; border-radius: 1px"></span><span style="width: 4px; height: 1.5px; background: {{g.ink}}; border-radius: 1px"></span></span>
</button>
</sc-for>
<sc-for list="{{xLabels}}" as="l" hint-placeholder-count="2">
<span aria-hidden="true" style="position: absolute; left: {{l.x}}px; top: {{l.y}}px; font-feature-settings: 'tnum' 1; font-weight: 700; font-size: 10px; color: {{l.c}}; white-space: nowrap; transform: translateX(-100%)">{{l.t}}</span>
</sc-for>
<sc-for list="{{badges}}" as="b" hint-placeholder-count="3">
<span aria-hidden="true" style="position: absolute; left: {{b.x}}px; top: {{b.y}}px; display: flex; gap: 4px; opacity: {{b.op}}"><span style="width: 18px; height: 18px; border-radius: 50%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; background: {{b.bg}}; color: {{b.fg}}; border: {{b.ring}}; box-shadow: {{b.sh}}">{{b.n}}</span><sc-if value="{{b.hasTag}}" hint-placeholder-val="{{ false }}"><span style="height: 18px; min-width: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; background: {{b.tagBg}}; color: {{b.tagFg}}">{{b.tag}}</span></sc-if></span>
</sc-for>

<sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
<section aria-label="{{c.aria}}" style="position: absolute; left: {{c.x}}px; top: {{card.y}}px; width: {{c.w}}px; height: {{card.h}}px; box-sizing: border-box; padding: 10px; border-radius: 12px; background: {{c.bg}}; border: {{c.border}}; box-shadow: {{c.sh}}; opacity: {{c.op}}; overflow: hidden">
<sc-if value="{{c.hatch}}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" style="position: absolute; inset: 0; background: repeating-linear-gradient(45deg, {{th.loA}} 0 3px, transparent 3px 6px)"></div></sc-if>
<div style="position: relative; display: flex; gap: 12px; height: 100%">
<div style="width: {{c.colW}}px; display: flex; flex-direction: column; gap: 6px">
<sc-if value="{{c.hasHead}}" hint-placeholder-val="{{ true }}">
<div style="height: 32px; display: flex; align-items: center; gap: 6px">
<span style="width: 22px; height: 22px; flex: 0 0 22px; border-radius: 50%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; background: {{c.nb}}; color: {{c.nf}}; border: {{c.ring}}; box-shadow: {{c.nsh}}">{{c.n}}</span>
<span style="flex: 1; min-width: 0; font-feature-settings: 'tnum' 1; font-size: 12px; font-weight: 600; color: {{th.mid}}; white-space: nowrap; overflow: hidden">{{c.range}}</span>
<sc-for list="{{c.btns}}" as="b" hint-placeholder-count="2">
<button aria-label="{{b.aria}}" aria-pressed="{{b.on}}" style="width: 32px; height: 32px; flex: 0 0 32px; padding: 0; display: flex; align-items: center; justify-content: center; background: {{b.bg}}; border: 1px solid {{b.b}}; border-radius: 7px; box-shadow: {{b.sh}}; font-size: 13px; font-weight: 800; color: {{b.fg}}"><sc-if value="{{b.isText}}" hint-placeholder-val="{{ true }}"><span style="text-shadow: {{b.tglow}}">{{b.t}}</span></sc-if><sc-if value="{{b.isIcon}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="{{b.d}}" stroke="{{b.fg}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="filter: {{b.glow}}"></path></svg></sc-if></button>
</sc-for>
</div>
</sc-if>
<div role="img" aria-label="{{c.scopeAria}}" style="position: relative; width: {{c.sw}}px; height: {{c.sh2}}px; border-radius: 8px; background: {{th.well}}; border: 1px solid {{th.wellB}}; box-shadow: {{th.wellSh}}; overflow: hidden">
<svg width="{{c.sw}}" height="{{c.sh2}}" viewBox="{{c.vb}}" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<path d="{{c.sc.grid}}" stroke="{{th.gridMinor}}" stroke-width="1" fill="none"></path>
<path d="{{c.sc.trans}}" fill="{{th.accent}}" fill-opacity="0.12"></path>
<path d="{{c.sc.inFill}}" fill="{{th.pre}}" fill-opacity="0.12"></path>
<path d="{{c.sc.outLine}}" stroke="{{th.mid}}" stroke-opacity="0.55" stroke-width="1" fill="none"></path>
<path d="{{c.sc.zero}}" stroke="{{th.zero}}" stroke-width="1"></path>
<path d="{{c.sc.upLight}}" fill="{{th.sem.up}}" fill-opacity="0.28"></path>
<path d="{{c.sc.upLight}}" fill="{{upPattern}}" fill-opacity="0.6"></path>
<path d="{{c.sc.upSolid}}" fill="{{th.sem.up}}" fill-opacity="0.65"></path>
<path d="{{c.sc.dnLight}}" fill="{{th.sem.gr}}" fill-opacity="0.28"></path>
<path d="{{c.sc.dnSolid}}" fill="{{th.sem.gr}}" fill-opacity="0.65"></path>
<path d="{{c.sc.hand}}" stroke="{{th.accent}}" stroke-width="1.2" stroke-dasharray="3 3" fill="none"></path>
<path d="{{c.sc.gain}}" stroke="{{th.curve}}" stroke-width="{{c.gw}}" fill="none" stroke-linejoin="round" style="filter: drop-shadow(0 0 3px {{th.curveGlow}})"></path>
<path d="{{c.sc.la}}" stroke="{{th.pre}}" stroke-width="1" stroke-dasharray="2 2" fill="none"></path>
</svg>
<sc-for list="{{c.sc.handles}}" as="h" hint-placeholder-count="0">
<button aria-label="{{h.aria}}" style="position: absolute; left: {{h.x}}px; top: {{h.y}}px; width: 28px; height: 28px; padding: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: {{h.w}}px; height: {{h.h}}px; border-radius: {{h.r}}px; box-sizing: border-box; background: {{th.accent}}; border: 2px solid {{th.needle}}; box-shadow: 0 0 10px {{th.accent}}"></span></button>
</sc-for>
<sc-for list="{{c.sc.labels}}" as="l" hint-placeholder-count="0">
<span aria-hidden="true" style="position: absolute; left: {{l.x}}px; top: {{l.y}}px; font-feature-settings: 'tnum' 1; font-weight: 600; font-size: 10px; color: {{th.lo}}">{{l.t}}</span>
</sc-for>
</div>
<sc-if value="{{c.isSmall}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 2px 8px">
<sc-for list="{{c.mini}}" as="d" hint-placeholder-count="2">
<button class="dial" aria-label="{{d.aria}}" style="height: 40px; min-width: 96px; display: flex; align-items: center; gap: 7px; padding: 0 2px; background: transparent; border: none">

          sh: b.solo ? '0 0 16px ' + hexA(th.needle, 0.35) : on ? '0 0 14px ' + hexA(accent, 0.3) : 'none', op: dimSolo ? 0.35 : b.mute ? 0.55 : bi === mergeIdx ? 0.6 : 1, hatch: b.mute,
          colW, hasHead: true, n: bi + 1, range: on ? fmtF(edges[bi]) + ' – ' + fmtF(edges[bi + 1]) : '', nb: on ? accent : hexA(accent, 0.25), nf: on ? th.nodeInk : th.accentText,
          ring: b.solo ? '2px solid ' + th.needle : 'none', nsh: on ? '0 0 8px ' + accent : 'none', btns,
          sw, sh2, vb: '0 0 ' + sw + ' ' + sh2, gw: on ? 2.2 : 1.6, sc: scopeOf(b, sw, sh2, false, on), isSmall: !on, mini: on ? [] : miniKnobs(b), isBig: on, knobs: on ? bandKnobs(b) : [],
          scopeAria: 'Band ' + (bi + 1) + ' transient scope: attack ' + dbN(b.a) + ' dB, sustain ' + dbN(b.s) + ' dB, time ' + Math.round(b.T) + ' ms' };
      });
    }
    th.surface = NT.surface1;
    cards.forEach((c) => { c.bg = th.surface; });
    const funnels = multi ? bands.map((b, bi) => {
      const rx0 = (bi === 0 ? 0 : fx(edges[bi])) + 2, rx1 = (bi === bands.length - 1 ? 1180 : fx(edges[bi + 1])) - 2, c = cards[bi], cx0 = c.x + 2, cx1 = c.x + c.w - 2, y0 = Lt.fy, y1 = Lt.cy, ym = (y0 + y1) / 2;
      return { d: 'M' + r1(rx0) + ' ' + y0 + ' C' + r1(rx0) + ' ' + ym + ' ' + r1(cx0) + ' ' + ym + ' ' + r1(cx0) + ' ' + y1 + ' L' + r1(cx1) + ' ' + y1 + ' C' + r1(cx1) + ' ' + ym + ' ' + r1(rx1) + ' ' + ym + ' ' + r1(rx1) + ' ' + y0 + ' Z',
        op: bi === sel ? 0.16 : 0.05, stroke: accent, sop: bi === sel ? 0.5 : 0 };
    }) : [];

    // ---------------- meters
    const my = (d) => { const y = 24 + (-Math.max(-60, d) / 60) * 564; return 588 - Math.round((588 - y) / 4) * 4; };
    const pk = (arr) => Math.max(...arr.slice(-5));
    const iNow = pk(inDb), oNow = pk(outDb);
    const mIn = 'M1203 588 V' + my(iNow) + ' M1213 588 V' + my(iNow - (CH2 ? 3 : 0.8));
    const mOut = 'M1245 588 V' + my(oNow) + ' M1255 588 V' + my(oNow - (CH2 ? 2.6 : 0.9));
    const meterWells = 'M1196 20 h26 v572 h-26 Z M1238 20 h26 v572 h-26 Z';

    // ---------------- detector sheet
    let sheet = { listenOn: 'false', lb: tbtn(false, th.sem.sc), grid: '', specFill: '', heard: '', heardC: th.sem.sc, curve: '', nodes: [], labels: [], knobs: [] };
    if (V('detector')) {
      const W2 = 380, H2 = 188, fx2 = (f) => 8 + (W2 - 16) * Math.log(f / 20) / Math.log(1000), gy2 = (g) => 70 - g * 3.2;
      const hpF = 90, lpF = 6000;
      const resp = (f) => { const h = Math.pow(f / hpF, 4), l = Math.pow(lpF / f, 4); return 10 * Math.log10(h / (1 + h)) + 10 * Math.log10(l / (1 + l)); };
      let cur = '', sp2 = '', heardTop = '';
      for (let i = 0; i <= 160; i++) {
        const f = 20 * Math.pow(1000, i / 160), x = r1(fx2(f)), lv = specLv(f, i);
        cur += (i ? 'L' : 'M') + x + ' ' + r1(gy2(Math.max(-24, resp(f))));
        sp2 += (i ? 'L' : 'M') + x + ' ' + r1(80 + (-lv - 12) / 60 * 96);
        heardTop += (i ? 'L' : 'M') + x + ' ' + r1(80 + (-(lv + Math.max(-40, resp(f))) - 12) / 60 * 96);
      }
      sheet = { listenOn: 'true', lb: tbtn(true, th.sem.sc), heardC: th.sem.sc,
        grid: [100, 1000, 10000].map((f) => 'M' + r1(fx2(f)) + ' 0 V' + H2).join(' ') + ' M0 ' + gy2(0) + ' H' + W2,
        specFill: sp2 + ' L' + r1(fx2(20000)) + ' 176 L8 176 Z', heard: heardTop + ' L' + r1(fx2(20000)) + ' 176 L8 176 Z', curve: cur,
        nodes: [{ x: r1(fx2(hpF) - 14), y: r1(gy2(-3) - 14), aria: 'Detector high-pass 90 Hz, drag sideways' }, { x: r1(fx2(lpF) - 14), y: r1(gy2(-3) - 14), aria: 'Detector low-pass 6.0 kHz, drag sideways' }],
        labels: [[100, '100'], [1000, '1k'], [10000, '10k']].map(([f, s]) => ({ x: r1(fx2(f) + 3), t: s })),
        knobs: [knob('FLOOR', '−60', 'dBFS', (-60 + 80) / 60, false), knob('LOOKAHEAD', '0.0', 'ms', 0, false)] };
    }
    const pop = { k: geo(0.5, false), opts: [['lr', G.lr, 'Left / Right'], ['ms', G.ms, 'Mid / Side']].map(([k2, d, aria]) => { const b = tbtn(k2 === 'ms', accent); return { on: k2 === 'ms' ? 'true' : 'false', aria, d, bg: b.bg, b: b.b, sh: b.sh, fg: b.fg, glow: b.glow }; }) };

    // ---------------- menus
    const mItem = (t2, d, on, keyHint, role, danger) => ({ head: false, sep: false, item: true, hasIcon: !!d, t: t2, d: d || '', key: keyHint || '', role: role || 'menuitemradio', on: on ? 'true' : 'false', ti: on ? '0' : '-1', bg: on ? hexA(accent, 0.18) : 'transparent', b: on ? accent : 'transparent', fg: danger ? th.sem.danger : th.hi, ic: danger ? th.sem.danger : on ? accent : th.mid });
    const SEP = { head: false, sep: true, item: false, t: '' };
    let menu = null;
    if (V('menu')) {
      menu = { aria: 'Band 2', x: r1(fx(700) - 20), y: ry - 150, w: 236, items: [
        mItem('Solo', G.solo, false, 'S', 'menuitem'), mItem('Mute', G.mute, false, 'M', 'menuitem'), SEP,
        mItem('Copy settings', G.copy, false, '⌘C', 'menuitem'), mItem('Paste settings', G.paste, false, '⌘V', 'menuitem'), mItem('Reset band', G.reset, false, '', 'menuitem'), SEP,
        mItem('Merge into band 1', G.merge, false, '', 'menuitem'), mItem('Merge into band 3', G.merge, false, '', 'menuitem'), mItem('Remove band', G.bin, false, 'Del', 'menuitem', true)] };
      menu.items.forEach((m) => { if (m.item) m.ti = '-1'; }); menu.items[0].ti = '0';
    }
    if (V('presets')) {
      const fac = ['Drum Punch', 'Kick Click', 'Snare Tighten', 'Room Killer', 'Pluck Soften', 'Bus Snap', 'Ambience Lift'];
      menu = { aria: 'Presets', x: 196, y: 6, w: 300, items: [mItem('Save as…', G.save, false), { head: true, sep: false, item: false, t: 'FACTORY' }].concat(fac.map((n) => mItem(n, '', n === 'Drum Punch')), [{ head: true, sep: false, item: false, t: 'YOURS' }, mItem('Live Toms', '', false), mItem('Acoustic Guitar Pick', '', false)]) };
    }

    // ---------------- header + footer
    const snaps = ['A', 'B', 'C', 'D'].map((k, i) => {
      const cur = (st.snap || 0) === i, empty = i > 1;
      return { k, on: cur ? 'true' : 'false', bg: cur ? hexA(accent, 0.16) : th.ctl, b: cur ? accent : th.ctlB, fg: cur ? th.accentText : empty ? th.dis : th.mid, sh: cur ? '0 0 12px ' + hexA(accent, 0.3) : th.raised, pick: () => this.setState({ snap: i }) };
    });
    const hb = (aria, d, on) => { const b = tbtn(on, accent); return { aria, d, on: on ? 'true' : 'false', bg: on ? b.bg : th.ctl, b: on ? b.b : th.ctlB, sh: on ? b.sh : th.raised, fg: on ? b.fg : th.mid, glow: b.glow }; };
    const headBtns = [hb(V('stereo') ? 'Stereo: Mid/Side, link 50 %' : 'Stereo: Left/Right, linked', V('stereo') ? G.ms : G.link, V('stereo')), hb('Detector', G.sliders, V('detector'))];
    const presetBtn = V('presets') ? { bg: th.ctl, b: accent, sh: '0 0 12px ' + hexA(accent, 0.3) } : { bg: th.ctl, b: th.ctlB, sh: th.raised };
    const footDrops = multi ? [{ aria: 'Crossover type: LR4 minimum phase', d: G.lr4, t: 'LR4', w: 110 }] : [];
    const tg = (aria, d, on) => { const b = tbtn(on, accent); return { aria, d, on: on ? 'true' : 'false', bg: on ? b.bg : th.ctl, b: on ? b.b : th.ctlB, sh: on ? b.sh : th.raised, fg: on ? b.fg : th.mid, glow: b.glow }; };
    const toggles = [tg('Auto gain', G.auto, false), tg('Clip after shaping', G.clip, V('clip')), tg('Delta: hear only what Shape adds or removes', G.delta, V('delta')), tg('Bypass', G.power, false)];
    const footDials = [
      Object.assign({ label: 'MIX', v: '100 %', aria: 'Mix 100 percent' }, geo(1, false, 15)),
      Object.assign({ label: 'PAN', v: '0 %', aria: 'Pan centre' }, geo(0.5, true, 15)),
      Object.assign({ label: 'OUTPUT', v: '0.0 dB', aria: 'Output 0.0 dB' }, geo(0.5, true, 15))
    ];

    // ---------------- status icon (no words in the display)
    let status = null;
    if (V('delta')) status = { c: accent, d: G.delta, bg: th.accentSoft, aria: 'Delta on: you hear only what Shape adds or removes' };
    if (V('detector')) status = { c: th.sem.sc, d: G.listen, bg: hexA(th.sem.sc, 0.18), aria: 'Listening to the detector' };
    if (V('help')) status = { c: accent, d: G.help, bg: th.accentSoft, aria: 'Help mode: hover anything; ? or Esc exits' };

    // ---------------- help strip
    const slot = (t2, w, c) => ({ t: t2, w, c: c || th.hi });
    const bs = bands[show];
    const lastP = gArr[gArr.length - 1];
    let helpSlots = [slot('IN ' + dbN(iNow), 70), slot('OUT ' + dbN(oNow), 78), slot('gain ' + dbN(lastP.g), 82, lastP.g >= 0 ? th.sem.up : th.sem.gr)], helpText = '— drag the scope’s first part for attack and its tail for sustain; pull a crossover in from either edge of the strip to split the sound into bands';
    if (multi) { helpSlots = [slot('Band ' + (show + 1), 60), slot(fmtF(edges[show]) + ' – ' + fmtF(edges[show + 1]), 150, th.mid), slot('attack ' + dbN(bs.a), 92, bs.a >= 0 ? th.sem.up : th.sem.gr), slot('sustain ' + dbN(bs.s), 98, bs.s >= 0 ? th.sem.up : th.sem.gr)]; helpText = '— drag a crossover sideways; double-click the strip to split; click a band to edit it'; }
    if (V('band-selected')) helpText = '— scope: drag the first part for attack, the tail for sustain, the dashed line for time; Alt-drag the shaded band for transition';
    if (V('split')) { helpSlots = [slot('New crossover', 104), slot('2.0 kHz', 66)]; helpText = '— release to make band 2; both sides keep band 1’s settings. Esc cancels.'; }
    if (V('merge')) { helpSlots = [slot('Merging', 64), slot('290 Hz', 60), slot('band 2 → band 3', 120, th.mid)]; helpText = '— release on the neighbour to remove band 2; band 3 grows and keeps its settings'; }
    if (V('solo')) { helpSlots = [slot('Band 2 solo', 92, th.hi), slot('150 Hz – 3.5 kHz', 130, th.mid)]; helpText = '— you hear only band 2; S again or Esc to stop'; }
    if (V('mute')) { helpSlots = [slot('Band 3 muted', 100), slot('3.5 – 20 kHz', 110, th.mid)]; helpText = '— band 3 is silent; M again to bring it back'; }
    if (V('stereo')) { helpSlots = [slot('Mid/Side', 76), slot('link 50 %', 76, th.mid), slot('M ' + dbN(lastP.g), 66, lastP.g >= 0 ? th.sem.up : th.sem.gr), slot('S ' + dbN(CH2.pts[NPT - 1][0].g), 66)]; helpText = '— solid trace is mid, dashed is side; raise link to make them move together'; }
    if (V('detector')) { helpSlots = [slot('Listening', 80, th.sem.sc), slot('90 Hz – 6.0 kHz', 130, th.mid)]; helpText = '— you hear what the detector hears; the hi-hats no longer trigger it. Click the headphones again to stop.'; }
    if (V('lookahead')) { helpSlots = [slot('Lookahead', 84), slot('2.0 ms', 60)]; helpText = '— the gain starts 2 ms before each hit so a boosted attack keeps its leading edge; the host is told 2.0 ms latency'; }
    if (V('delta')) { helpSlots = [slot('Delta', 50, th.accentText)]; helpText = '— you hear only what Shape adds or removes: with attack up and sustain down, the clicks and the missing tails'; }
    if (V('clip')) { helpSlots = [slot('Clip', 40), slot('ceiling −6.0 dB', 120), slot('soft 40 %', 80, th.mid)]; helpText = '— the amber caps are what the clipper takes off the boosted attacks; drag the line, Alt-drag for softness'; }
    if (V('empty')) { helpSlots = [slot('Init', 40)]; helpText = '— attack and sustain are 0 dB, so Shape passes audio unchanged and nulls. Ticks mark the hits it detects; drag the scope up to sharpen them.'; }
    if (V('presets')) { helpSlots = [slot('Drum Punch', 96), slot('Factory', 70, th.mid)]; helpText = '— hover a preset to hear it; the dot after a name means the sound has moved on'; }
    if (V('menu')) { helpSlots = [slot('Band 2', 60), slot('150 Hz – 3.5 kHz', 130, th.mid)]; helpText = '— right-click a band in the strip or its card'; }
    if (V('help')) { helpSlots = [slot('Help mode', 86)]; helpText = '— hover any control for its explanation'; }

    const helpSpots = [
      { n: 1, t: 'History', d: 'Input dim, output lit. Below, the gain: boosts rise, cuts hang. Solid is the attack, light is the sustain.', x: 6, y: 6, w: 1170, h: Lt.h1 - 10, lx: 360, ly: 40 },
      { n: 2, t: 'Hits', d: 'A tick for every hit the detector finds; its height is how sharp the hit is.', x: 6, y: Lt.sep - 8, w: 1170, h: 24, lx: 700, ly: Lt.sep + 26 },
      { n: 3, t: 'Bands', d: 'Drag a crossover sideways. Pull one in from an edge, or double-click, to split.', x: 4, y: ry - 4, w: 1172, h: rh + 8, lx: 60, ly: ry - 74 },
      { n: 4, t: 'Scope', d: 'A test hit through this band. Drag the attack, the tail, or the dashed line.', x: cards[sel].x, y: Lt.cy, w: 304, h: Lt.ch, lx: cards[sel].x + 320, ly: Lt.cy + 12 },
      { n: 5, t: 'Meters', d: 'In and out. Values in the help strip.', x: 1190, y: 14, w: 82, h: 590, lx: 1000, ly: 120 },
      { n: 6, t: 'Stereo · detector', d: 'Shape’s own header buttons.', x: 936, y: -50, w: 104, h: 44, lx: 700, ly: 10 }
    ].map((h) => Object.assign(h, { y: h.y + 56, ly: h.ly + 56 }));

    function slots(list, empty, pfx) { const o = {}; for (let i = 0; i < 5; i++) o[pfx + i] = list[i] || empty; return o; }
    return {
      th, G, presetName: V('empty') ? 'Init' : 'Drum Punch', presetDirty: V('split') || V('merge') || multi && !V('help') ? ' •' : '', isPresets: V('presets') ? 'true' : 'false', presetBtn,
      snaps, headBtns,
      listenFrame: V('detector') ? 'inset 0 0 0 2px ' + th.sem.sc + ', inset 0 0 36px ' + hexA(th.sem.sc, 0.35) : 'none',
      displayAria: 'Shape display: 6 second history with signed shaping gain and hit marks, ' + (multi ? bands.length + ' bands split at ' + xovers.map(fmtF).join(', ') : 'one band') + ', transient scope' + (multi ? 's' : '') + ' and meters',
      outColor: V('detector') ? th.sem.sc : th.curve, outFillA: V('delta') ? 0.3 : 0.12,
      hGrid, laneSep: 'M0 ' + Lt.sep + '.5 H1180', zeroLine: 'M0 ' + Lt.gz + ' H1180',
      inFill: inLine + ' L1180 ' + Lt.lv1 + ' L0 ' + Lt.lv1 + ' Z', inLine, outLine, outFillP: outLine + ' L1180 ' + Lt.lv1 + ' L0 ' + Lt.lv1 + ' Z', clipFill, ceilLine, ceilBand, hasCeil: V('clip'), ceil,
      upLight, upSolid, dnLight, dnSolid, upEdge, dnEdge, gainEdge2, otherGain, hitTicks, upPattern: key === 'cb' ? 'url(#upDots)' : 'transparent',
      dbLabels, fLabels, rail, rg: slots(regions, { x: 0, w: 0, fill: 'transparent', op: 0, stroke: 'none', hatch: 'transparent' }, 'r'), fn: slots(funnels, { d: '', op: 0, sop: 0 }, 'f'), xGrips, xLabels, badges, funnels, card: { y: Lt.cy, h: Lt.ch }, cards,
      meterWells, mIn, mOut,
      hasStatus: !!status, status: status || { c: accent, d: '', bg: 'transparent', aria: '' },
      hasSheet: V('detector'), sheet, hasPop: V('stereo'), pop, hasMenu: !!menu, menu: menu || { aria: '', x: 0, y: 0, w: 0, items: [] },
      isHelp: V('help'), helpSpots, helpSlots, helpText,
      footDrops, latency: la ? '2.0 ms' : '0 ms', latC: la ? th.accentText : th.hi, toggles, footDials
    };
  }
}
</script>
