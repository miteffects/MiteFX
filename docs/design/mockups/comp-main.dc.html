<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mite Comp — main screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
.dial>span:first-child{transition:transform 140ms cubic-bezier(.2,0,0,1)}
.dial:hover>span:first-child{transform:scale(1.1)}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 760px; display: flex; flex-direction: column; background: {{th.win}}; color: {{th.hi}}; font-family: Manrope, system-ui, sans-serif; font-size: 12px; overflow: hidden">

<header style="height: 56px; flex: 0 0 56px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: {{th.win}}; border-bottom: 1px solid {{th.line}}">
<button aria-label="Mite Comp menu" style="height: 40px; display: flex; align-items: center; gap: 9px; padding: 0 12px 0 4px; background: transparent; border: none; border-radius: 8px">
<svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true" style="overflow: visible"><path d="M10.5 15 L5 12 M10 19 L4 19 M10.5 23 L5 26 M21.5 15 L27 12 M22 19 L28 19 M21.5 23 L27 26" stroke="{{th.lo}}" stroke-width="1.4" stroke-linecap="round"></path><path d="M16 11 C20.5 11 22 15 22 19 C22 24 19.5 28 16 28 C12.5 28 10 24 10 19 C10 15 11.5 11 16 11 Z" stroke="{{th.hi}}" stroke-width="1.6"></path><circle cx="16" cy="7.4" r="2.6" stroke="{{th.hi}}" stroke-width="1.6"></circle><path d="M12 24 L16 19.5 C17.2 18.2 18.4 17.8 20 17.4" stroke="{{th.accent}}" stroke-width="1.8" stroke-linecap="round" style="filter: drop-shadow(0 0 3px {{th.accent}})"></path></svg>
<span style="font-size: 16px; font-weight: 800; letter-spacing: -0.01em">Mite<span style="font-weight: 500; color: {{th.mid}}"> Comp</span></span>
</button>
<div style="width: 36px"></div>
<button aria-label="Previous preset" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: {{th.ctl}}; border: 1px solid {{th.ctlB}}; border-radius: 7px; box-shadow: {{th.raised}}"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M7.5 2.5 L4 6 L7.5 9.5" stroke="{{th.mid}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<button aria-label="Preset: {{presetName}}. Open the preset list" aria-expanded="{{isPresets}}" style="height: 36px; width: 300px; display: flex; align-items: center; gap: 9px; padding: 0 12px; background: {{presetBtn.bg}}; border: 1px solid {{presetBtn.b}}; border-radius: 7px; box-shadow: {{presetBtn.sh}}; text-align: left">
<svg width="15" height="15" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="4.2" stroke="{{th.mid}}" stroke-width="1.5"></circle><path d="M9.2 9.2 L12.5 12.5" stroke="{{th.mid}}" stroke-width="1.5" stroke-linecap="round"></path></svg>
<span style="flex: 1; font-size: 13px; font-weight: 600; color: {{th.hi}}">{{presetName}}<span style="color: {{th.accent}}; font-weight: 800">{{presetDirty}}</span></span>
</button>
<button aria-label="Next preset" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: {{th.ctl}}; border: 1px solid {{th.ctlB}}; border-radius: 7px; box-shadow: {{th.raised}}"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M4.5 2.5 L8 6 L4.5 9.5" stroke="{{th.mid}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<div style="width: 18px"></div>
<button aria-label="Undo" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: {{th.ctl}}; border: 1px solid {{th.ctlB}}; border-radius: 7px; box-shadow: {{th.raised}}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5.5 3.5 L2.5 6.5 L5.5 9.5" stroke="{{th.mid}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3 6.5 H9.5 A3.8 3.8 0 0 1 9.5 14 H7" stroke="{{th.mid}}" stroke-width="1.5" stroke-linecap="round"></path></svg></button>
<button aria-label="Redo, nothing to redo" disabled style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: {{th.ctl}}; border: 1px solid {{th.ctlB}}; border-radius: 7px; box-shadow: {{th.raised}}; cursor: default"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10.5 3.5 L13.5 6.5 L10.5 9.5" stroke="{{th.dis}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M13 6.5 H6.5 A3.8 3.8 0 0 0 6.5 14 H9" stroke="{{th.dis}}" stroke-width="1.5" stroke-linecap="round"></path></svg></button>
<div style="width: 18px"></div>
<div role="group" aria-label="Snapshots — drag a letter onto another to copy it" style="display: flex; gap: 8px">
<sc-for list="{{snaps}}" as="s" hint-placeholder-count="4">
<button aria-label="Snapshot {{s.k}}" aria-pressed="{{s.on}}" onClick="{{s.pick}}" style="width: 36px; height: 36px; border-radius: 7px; font-weight: 700; font-size: 13px; background: {{s.bg}}; border: 1px solid {{s.b}}; color: {{s.fg}}; box-shadow: {{s.sh}}">{{s.k}}</button>
</sc-for>
</div>
<div style="width: 26px"></div>
<sc-for list="{{headBtns}}" as="h" hint-placeholder-count="3">
<button aria-label="{{h.aria}}" aria-pressed="{{h.on}}" onClick="{{h.pick}}" style="width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; background: {{h.bg}}; border: 1px solid {{h.b}}; border-radius: 7px; box-shadow: {{h.sh}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="overflow: visible"><path d="{{h.d}}" stroke="{{h.fg}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="filter: {{h.glow}}"></path></svg></button>
</sc-for>
</header>

<main style="position: relative; height: 620px; flex: 0 0 620px; background: {{th.disp}}; overflow: hidden; box-shadow: {{listenFrame}}">
<svg width="1280" height="620" viewBox="0 0 1280 620" style="position: absolute; left: 0; top: 0" role="img" aria-label="{{displayAria}}">
<defs>
<linearGradient id="outFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{outColor}}" stop-opacity="{{outFillA}}"></stop><stop offset="1" stop-color="{{outColor}}" stop-opacity="0.01"></stop></linearGradient>
<linearGradient id="grFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{th.sem.gr}}" stop-opacity="0.55"></stop><stop offset="1" stop-color="{{th.sem.gr}}" stop-opacity="0.18"></stop></linearGradient>
<linearGradient id="upFill" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="{{th.sem.up}}" stop-opacity="0.50"></stop><stop offset="1" stop-color="{{th.sem.up}}" stop-opacity="0.14"></stop></linearGradient>
<pattern id="upDots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="{{th.sem.up}}"></circle></pattern>
<filter id="glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="1320" height="660"><feGaussianBlur stdDeviation="5" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
<filter id="sglow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="1320" height="660"><feGaussianBlur stdDeviation="2.4" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
</defs>
<path d="{{hGrid}}" stroke="{{th.gridMinor}}" stroke-width="1" fill="none"></path>
<path d="M0 24 H776" stroke="{{th.zero}}" stroke-width="1"></path>
<path d="{{inFill}}" fill="{{th.pre}}" fill-opacity="0.16"></path>
<path d="{{inLine}}" stroke="{{th.pre}}" stroke-opacity="0.55" stroke-width="1" fill="none"></path>
<path d="{{upFillP}}" fill="url(#upFill)"></path>
<path d="{{upFillP}}" fill="{{upPattern}}" fill-opacity="0.6"></path>
<path d="{{upEdge}}" stroke="{{th.sem.up}}" stroke-width="1.6" fill="none" filter="url(#sglow)"></path>
<path d="{{outFillP}}" fill="url(#outFill)"></path>
<path d="{{outLine}}" stroke="{{outColor}}" stroke-width="1.8" fill="none" filter="url(#sglow)"></path>
<path d="{{grFillP}}" fill="url(#grFill)"></path>
<path d="{{grEdge}}" stroke="{{th.sem.gr}}" stroke-width="1.8" fill="none" filter="url(#sglow)"></path>
<path d="{{grEdge2}}" stroke="{{th.sem.gr}}" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#sglow)"></path>
<path d="M776.5 0 V620" stroke="{{th.line}}" stroke-width="1"></path>
<rect x="796.5" y="16.5" width="384" height="384" rx="10" fill="{{th.well}}" stroke="{{th.wellB}}"></rect>
<path d="{{cGrid}}" stroke="{{th.gridMajor}}" stroke-width="1" fill="none"></path>
<path d="{{cDiag}}" stroke="{{th.zero}}" stroke-width="1.2" stroke-dasharray="3 4" fill="none"></path>
<path d="{{shadeDown}}" fill="{{th.sem.gr}}" fill-opacity="0.20"></path>
<path d="{{shadeUp}}" fill="{{th.sem.up}}" fill-opacity="0.22"></path>
<path d="{{shadeUp}}" fill="{{upPattern}}" fill-opacity="0.6"></path>
<path d="{{ghostCurve}}" stroke="{{th.accent}}" stroke-width="1.6" stroke-dasharray="5 4" fill="none" filter="url(#sglow)"></path>
<path d="{{cCurve}}" stroke="{{th.curve}}" stroke-width="2.4" fill="none" filter="url(#glow)" stroke-linejoin="round"></path>
<path d="{{trail}}" stroke="{{th.accent}}" stroke-width="2" stroke-linecap="round" fill="none" stroke-opacity="0.28" stroke-dasharray="1 5"></path>
<path d="{{meterWells}}" fill="{{th.meterWell}}" stroke="{{th.wellB}}"></path>
<path d="M1199 588 V24 M1209 588 V24 M1225 24 V588 M1235 24 V588 M1251 588 V24 M1261 588 V24" stroke="{{th.meterOff}}" stroke-width="8" stroke-dasharray="2 2"></path>
<path d="{{mIn}}" stroke="{{th.pre}}" stroke-width="8" stroke-dasharray="2 2"></path>
<path d="{{mGr}}" stroke="{{th.sem.gr}}" stroke-width="8" stroke-dasharray="2 2" filter="url(#sglow)"></path>
<path d="{{mOut}}" stroke="{{outColor}}" stroke-width="8" stroke-dasharray="2 2" filter="url(#sglow)"></path>
<path d="{{mTarget}}" stroke="{{th.sem.gr}}" stroke-width="2" fill="none"></path>
</svg>

<sc-for list="{{dbLabels}}" as="l" hint-placeholder-count="5">
<span style="position: absolute; left: 744px; top: {{l.y}}px; font-feature-settings: 'tnum' 1; font-weight: 600; font-size: 10px; color: {{th.lo}}">{{l.t}}</span>
</sc-for>
<sc-for list="{{axisLabels}}" as="l" hint-placeholder-count="6">
<span style="position: absolute; left: {{l.x}}px; top: {{l.y}}px; font-feature-settings: 'tnum' 1; font-weight: 600; font-size: 10px; color: {{th.lo}}">{{l.t}}</span>
</sc-for>
<sc-for list="{{meterLabels}}" as="l" hint-placeholder-count="3">
<span aria-hidden="true" style="position: absolute; left: {{l.x}}px; top: 596px; width: 28px; text-align: center; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; color: {{th.lo}}">{{l.t}}</span>
</sc-for>
<sc-for list="{{meterIcons}}" as="m" hint-placeholder-count="0">
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" style="position: absolute; left: {{m.x}}px; top: 6px"><path d="{{m.d}}" stroke="{{th.mid}}" stroke-width="1.3" stroke-linecap="round"></path></svg>
</sc-for>

<sc-for list="{{thrLines}}" as="t" hint-placeholder-count="1">
<div aria-hidden="true" style="position: absolute; left: 0; top: {{t.y}}px; width: 736px; height: 0; border-top: 1.5px {{t.style}} {{t.c}}; opacity: {{t.op}}; filter: drop-shadow(0 0 4px {{t.c}})"></div>
<button aria-label="{{t.aria}}" style="position: absolute; left: 738px; top: {{t.gy}}px; width: 34px; height: 22px; padding: 0; border-radius: 11px; background: {{t.gbg}}; border: 1.5px {{t.style}} {{t.c}}; display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 10px; font-weight: 800; color: {{t.gfg}}; box-shadow: {{t.gsh}}; opacity: {{t.op}}"><svg width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><path d="M1 3.5 L4 1 L7 3.5 M1 6.5 L4 9 L7 6.5" stroke="{{t.gfg}}" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{t.n}}</button>
</sc-for>
<sc-if value="{{hasTarget}}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="position: absolute; left: 0; top: {{target.y}}px; width: 736px; height: 0; border-top: 1.5px dashed {{th.sem.gr}}; opacity: 0.9"></div>
<button aria-label="Smart target gain reduction {{target.v}}, drag to change" style="position: absolute; left: 708px; top: {{target.gy}}px; height: 22px; padding: 0 8px; border-radius: 11px; background: {{th.disp}}; border: 1.5px dashed {{th.sem.gr}}; font-feature-settings: 'tnum' 1; font-size: 10px; font-weight: 800; color: {{th.sem.gr}}">{{target.v}}</button>
</sc-if>

<div role="list" aria-label="Gain change per stage" style="position: absolute; left: 796px; top: 420px; width: 384px; height: 176px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{strip}}" as="c" hint-placeholder-count="4">
<div role="listitem" aria-label="{{c.aria}}" style="position: relative; border-radius: 10px; box-sizing: border-box; border: 1px {{c.bs}} {{c.b}}; background: {{c.bg}}; box-shadow: {{c.sh}}; opacity: {{c.op}}; overflow: hidden">
<sc-if value="{{c.live}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 10px; top: 9px; display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; background: {{c.nb}}; color: {{c.nf}}; box-shadow: 0 0 8px {{c.glowC}}">{{c.n}}</span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 21 L21 3" stroke="{{th.zero}}" stroke-width="1" stroke-dasharray="2 2"></path><path d="{{c.d}}" stroke="{{c.qc}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
<svg width="100%" height="100%" viewBox="0 0 88 176" preserveAspectRatio="none" style="position: absolute; left: 0; top: 0" aria-hidden="true"><path d="M44 40 V168" stroke="{{th.meterOff}}" stroke-width="14" stroke-dasharray="2 2"></path><path d="{{c.bar}}" stroke="{{c.barC}}" stroke-width="14" stroke-dasharray="2 2" style="filter: drop-shadow(0 0 3px {{c.barC}})"></path></svg>
</sc-if>
</div>
</sc-for>
</div>
<sc-for list="{{diamonds}}" as="d" hint-placeholder-count="1">
<span aria-hidden="true" style="position: absolute; left: {{d.x}}px; top: {{d.y}}px; width: 8px; height: 8px; transform: rotate(45deg); background: {{d.c}}; opacity: {{d.op}}; box-shadow: 0 0 6px {{d.c}}"></span>
</sc-for>
<sc-for list="{{nodes}}" as="n" hint-placeholder-count="1">
<button aria-label="{{n.aria}}" aria-pressed="{{n.on}}" onClick="{{n.pick}}" style="position: absolute; left: {{n.x}}px; top: {{n.y}}px; width: 32px; height: 32px; padding: 0; background: transparent; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: {{n.op}}">
<span style="width: {{n.size}}px; height: {{n.size}}px; box-sizing: border-box; border-radius: 50%; background: {{n.fill}}; border: 2px {{n.bs}} {{n.stroke}}; box-shadow: {{n.shadow}}; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: {{n.ink}}">{{n.num}}</span>
</button>
</sc-for>
<sc-if value="{{hasDot}}" hint-placeholder-val="{{ true }}">
<span aria-hidden="true" style="position: absolute; left: {{dot.x}}px; top: {{dot.y}}px; width: 12px; height: 12px; border-radius: 50%; background: {{th.needle}}; box-shadow: 0 0 0 3px {{th.accentSoft}}, 0 0 14px {{th.accent}}"></span>
</sc-if>
<sc-for list="{{grips}}" as="g" hint-placeholder-count="0">
<span aria-hidden="true" style="position: absolute; left: {{g.x}}px; top: {{g.y}}px; width: 22px; height: 14px; border-radius: 7px; border: 1.5px dashed {{g.c}}; background: {{g.bg}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px {{g.glow}}"><svg width="8" height="6" viewBox="0 0 8 6"><path d="{{g.d}}" stroke="{{g.c}}" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
</sc-for>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="position: absolute; left: 800px; top: 410px; width: 380px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none">
<svg width="120" height="40" viewBox="0 0 120 40" fill="none"><path d="M10 34 L110 6" stroke="{{th.zero}}" stroke-width="1.5" stroke-dasharray="3 4"></path><path d="M60 20 V8 M55 13 L60 8 L65 13 M60 21 V33 M55 28 L60 33 L65 28" stroke="{{th.accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 4px {{th.accent}})"></path></svg>
<span style="font-size: 14px; font-weight: 700; color: {{th.hi}}">Pull the line to make a stage</span>
</div>
</sc-if>

<sc-if value="{{isDelta}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 330px; top: 14px; height: 32px; padding: 0 14px 0 10px; display: flex; align-items: center; gap: 8px; border-radius: 16px; background: {{th.accentSoft}}; border: 1.5px solid {{th.accent}}; box-shadow: 0 0 18px {{th.accentSoft}}; font-weight: 800; color: {{th.hi}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4 L20.5 19 H3.5 Z" stroke="{{th.accent}}" stroke-width="2" stroke-linejoin="round"></path></svg>Removed signal</div>
</sc-if>
<sc-if value="{{isListen}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 270px; top: 14px; height: 32px; padding: 0 14px 0 10px; display: flex; align-items: center; gap: 8px; border-radius: 16px; background: {{th.scSoft}}; border: 1.5px solid {{th.sem.sc}}; box-shadow: 0 0 18px {{th.sem.sc}}; font-weight: 800; color: {{th.hi}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 14 V12 a8 8 0 0 1 16 0 V14 M4 14 h3 v6 h-3 Z M20 14 h-3 v6 h3 Z" stroke="{{th.sem.sc}}" stroke-width="1.8" stroke-linejoin="round"></path></svg>Detector</div>
</sc-if>

<sc-if value="{{hasStage}}" hint-placeholder-val="{{ false }}">
<section aria-label="{{sp.title}} controls" style="position: absolute; left: 12px; top: 402px; width: 708px; height: 208px; box-sizing: border-box; padding: 12px 14px; display: flex; gap: 12px; background: {{th.glass}}; backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2); border: 1px solid {{th.glassB}}; border-radius: 14px; box-shadow: {{th.glassSh}}">
<div style="width: 250px; display: flex; flex-direction: column; gap: 10px">
<div role="img" aria-label="{{sp.scopeAria}}" style="position: relative; width: 250px; height: 124px; border-radius: 8px; background: {{th.well}}; border: 1px solid {{th.wellB}}; box-shadow: {{th.wellSh}}; overflow: hidden">
<svg width="250" height="124" viewBox="0 0 250 124" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<path d="{{sp.scGrid}}" stroke="{{th.gridMinor}}" stroke-width="1" fill="none"></path>
<path d="{{sp.scIn}}" fill="{{th.pre}}" fill-opacity="0.12"></path>
<path d="{{sp.scGr}}" fill="{{th.sem.gr}}" fill-opacity="0.28"></path>
<path d="{{sp.scGrEdge}}" stroke="{{th.sem.gr}}" stroke-width="1.8" fill="none" style="filter: drop-shadow(0 0 3px {{th.sem.gr}})"></path>
<path d="{{sp.scMarks}}" stroke="{{th.accent}}" stroke-width="1" stroke-dasharray="2 3" fill="none"></path>
</svg>
<sc-for list="{{sp.handles}}" as="h" hint-placeholder-count="2">
<button aria-label="{{h.aria}}" style="position: absolute; left: {{h.x}}px; top: {{h.y}}px; width: 24px; height: 24px; padding: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: 11px; height: 11px; border-radius: 50%; background: {{th.accent}}; border: 2px solid {{th.needle}}; box-sizing: border-box; box-shadow: 0 0 10px {{th.accent}}"></span></button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 9px; height: 9px; border-radius: 50%; background: {{th.accent}}; box-shadow: 0 0 8px {{th.accent}}"></span><span style="font-size: 15px; font-weight: 700">{{sp.title}}</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 21 L21 3" stroke="{{th.zero}}" stroke-width="1.2" stroke-dasharray="2 2"></path><path d="{{sp.qGlyph}}" stroke="{{sp.qColor}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
</div>
<div style="width: 116px; display: flex; flex-direction: column; gap: 10px">
<div role="radiogroup" aria-label="Quadrant, normally set by where you pull the curve" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{sp.quads}}" as="q" hint-placeholder-count="4">
<button role="radio" aria-checked="{{q.on}}" aria-label="{{q.aria}}" style="height: 40px; display: flex; align-items: center; justify-content: center; background: {{q.bg}}; border: 1px solid {{q.b}}; border-radius: 7px; box-shadow: {{q.sh}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 21 L21 3" stroke="{{th.zero}}" stroke-width="1" stroke-dasharray="2 2"></path><path d="{{q.d}}" stroke="{{q.fg}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="filter: {{q.glow}}"></path></svg></button>
</sc-for>
</div>

    const curChar = V('character') ? 'Opto' : V('custom') ? 'Custom' : V('stages') || V('stage-selected') ? 'Bus' : 'Clean';
    const curSmart = V('smart') ? 'Vocal' : V('menu') ? 'Adaptive' : 'Off';
    const mItem = (t2, d, on) => ({ head: false, item: true, hasIcon: !!d, t: t2, d: d || '', on: on ? 'true' : 'false', ti: on ? '0' : '-1', bg: on ? hexA(accent, 0.18) : 'transparent', b: on ? accent : 'transparent', fg: th.hi, ic: on ? accent : th.mid });
    let menu = null;
    if (V('character')) menu = { aria: 'Character', x: 16, y: 362, w: 210, items: charList.map(([n, d]) => mItem(n, d, n === curChar)) };
    if (V('menu')) menu = { aria: 'Smart', x: 196, y: 460, w: 200, items: smartList.map(([n, d]) => mItem(n, d, n === curSmart)) };
    if (V('presets')) {
      const fac = ['Vocal Leveller', 'Drum Bus Glue', 'Gentle Master', 'Bass Control', 'Snare Snap', 'Gate + Comp', 'Room Tamer'];
      menu = { aria: 'Presets', x: 196, y: 6, w: 300, items: [mItem('Save as…', G.save, false), { head: true, item: false, t: 'FACTORY' }].concat(fac.map((n) => mItem(n, '', n === 'Vocal Leveller')), [{ head: true, item: false, t: 'YOURS' }, mItem('Podcast Voice', '', false), mItem('Live Kick', '', false)]) };
    }

    // ---------------- header + footer
    const snaps = ['A', 'B', 'C', 'D'].map((k, i) => {
      const cur = (st.snap || 0) === i, empty = i > 1;
      return { k, on: cur ? 'true' : 'false', bg: cur ? hexA(accent, 0.16) : th.ctl, b: cur ? accent : th.ctlB, fg: cur ? th.accentText : empty ? th.dis : th.mid, sh: cur ? '0 0 12px ' + hexA(accent, 0.3) : th.raised, pick: () => this.setState({ snap: i }) };
    });
    const hb = (aria, d, on, color) => { const b = btn(on, color); return { aria, d, on: on ? 'true' : 'false', bg: on ? b.bg : th.ctl, b: on ? b.b : th.ctlB, sh: on ? b.sh : th.raised, fg: on ? b.fg : th.mid, glow: b.glow, pick: () => {} }; };
    const headBtns = [
      hb('Sidechain', G.key, V('sidechain') || V('listen'), th.sem.sc),
      hb('Stereo: Mid/Side, link 50 %', V('stereo') ? G.ms : G.link, V('stereo')),
      hb('Detector and output settings', G.sliders, V('lookahead'))
    ];
    const presetBtn = V('presets') ? { bg: th.ctl, b: accent, sh: '0 0 12px ' + hexA(accent, 0.3) } : { bg: th.ctl, b: th.ctlB, sh: th.raised };
    const charD = charList.find((c) => c[0] === curChar)[1], smartD = smartList.find((c) => c[0] === curSmart)[1];
    const fd = (aria, d, t2, w, open, lit) => ({ aria, d, t: t2, w, open: open ? 'true' : 'false', bg: th.ctl, b: open ? accent : th.ctlB, sh: open ? '0 0 12px ' + hexA(accent, 0.3) : th.raised, ic: lit ? accent : th.mid, glow: lit ? 'drop-shadow(0 0 3px ' + accent + ')' : 'none' });
    const footDrops = [fd('Character: ' + curChar, charD, curChar, 150, V('character'), curChar !== 'Clean'), fd('Smart: ' + curSmart, smartD, curSmart, 140, V('menu'), curSmart !== 'Off')];
    const lat = V('lookahead') ? '5.0 ms' : '0 ms';
    const tg = (aria, d, on, pick) => { const b = btn(on); return { aria, d, on: on ? 'true' : 'false', bg: on ? b.bg : th.ctl, b: on ? b.b : th.ctlB, sh: on ? b.sh : th.raised, fg: on ? b.fg : th.mid, glow: b.glow, pick }; };
    const toggles = [tg('Auto makeup', G.auto, !V('empty'), () => {}), tg('Delta: hear only what the compressor takes away', G.delta, V('delta'), () => {}), tg('Bypass', G.power, false, () => {})];
    const footDials = [
      Object.assign({ label: 'MIX', v: '100 %', aria: 'Mix 100 percent' }, geo(1, false, 15)),
      Object.assign({ label: 'PAN', v: '0 %', aria: 'Pan centre' }, geo(0.5, true, 15)),
      Object.assign({ label: 'OUTPUT', v: '0.0 dB', aria: 'Output 0.0 dB' }, geo(0.5, true, 15))
    ];

    // ---------------- help strip
    const slot = (t2, w, c) => ({ t: t2, w, c: c || th.hi });
    let helpSlots = [], helpText = '';
    const s0 = selStage || prim;
    const grNow = Math.min(0, last.g);
    if (selStage) { helpSlots = [slot('Stage ' + s0.id, 74), slot(QD[s0.q].n, 128, th.mid), slot(fmtDb(s0.T), 74), slot(fmtR(s0.R), 50)]; helpText = '— drag across to move the threshold, away from the line for ratio, Alt-drag for knee, double-click resets'; }
    else { helpSlots = [slot('IN ' + dbN(last.x), 74), slot('GR ' + dbN(grNow), 74, th.sem.gr), slot('OUT ' + dbN(oNow), 82)]; helpText = '— pull the curve below the line to compress, above it to lift; drag a threshold grip on the history'; }
    if (V('create')) { helpSlots = [slot('New stage 2', 96), slot('Compress', 90, th.mid), slot('−8.0 dB', 74), slot('6.0:1', 50)]; helpText = '— pulled below the line above stage 1: release to create, Esc cancels'; }
    if (V('empty')) { helpSlots = [slot('No stages', 92)]; helpText = '— the curve is on the line, so the plugin passes audio unchanged. Pull it below the line to compress.'; }
    if (V('smart')) { helpSlots = [slot('Smart Vocal', 96), slot('slide ' + dbN(smartOff) + ' dB', 104, th.mid), slot('target 6 dB', 90, th.sem.gr)]; helpText = '— the curve follows the voice to hold the target; dashed lines are where you set it'; }
    if (V('sidechain')) { helpSlots = [slot('Sidechain', 86), slot('External', 72, th.mid), slot('3 bands', 64)]; helpText = '— the detector hears the key input through this EQ; Listen to hear it'; }
    if (V('listen')) { helpSlots = [slot('Listening', 86, th.sem.sc), slot('detector', 76, th.mid)]; helpText = '— the plugin outputs the filtered sidechain, not your track. Click the headphones again to stop.'; }
    if (V('stereo')) { helpSlots = [slot('Mid/Side', 76), slot('link 50 %', 76, th.mid), slot('M ' + dbN(Math.min(0, last.g)), 70, th.sem.gr), slot('S ' + dbN(Math.min(0, last2.g)), 70, th.sem.gr)]; helpText = '— solid trace is mid, dashed is side; raise link to make them move together'; }
    if (V('lookahead')) { helpSlots = [slot('Lookahead', 86), slot('5.0 ms', 64), slot('4×', 40, th.mid)]; helpText = '— the plugin reports 5.0 ms latency to the host'; }
    if (V('delta')) { helpSlots = [slot('Delta', 60, th.accentText), slot('GR ' + dbN(grNow), 74, th.sem.gr)]; helpText = '— you hear only what the compressor takes away; the lit trace is that difference'; }
    if (V('character')) { helpSlots = [slot('Opto', 60), slot('slow, smooth release', 160, th.mid)]; helpText = '— character changes how the stages move, not the curve'; }
    if (V('custom')) { helpSlots = [slot('Custom', 70), slot('from Opto', 80, th.mid)]; helpText = '— shape attack, release, drive and program dependence by hand'; }
    if (V('menu')) { helpSlots = [slot('Smart', 54), slot('Adaptive', 76, th.mid)]; helpText = '— bends the release to the material'; }
    if (V('presets')) { helpSlots = [slot('Vocal Leveller', 120), slot('Factory', 70, th.mid)]; helpText = '— the dot after a name means the sound has moved on from the preset'; }
    if (V('help')) { helpSlots = [slot('Help mode', 86)]; helpText = '— hover any control for its explanation'; }

    const helpSpots = [
      { n: 1, t: 'History', d: 'Input dim, output lit, gain reduction hangs from the top.', x: 8, y: 64, w: 760, h: 250, lx: 40, ly: 330 },
      { n: 2, t: 'Threshold grips', d: 'Drag a numbered grip up or down.', x: 732, y: 56 + r1(lvY(-18)) - 14, w: 44, h: 28, lx: 520, ly: 56 + r1(lvY(-18)) + 22 },
      { n: 3, t: 'Transfer curve', d: 'Pull below the line to compress, above it to lift.', x: 792, y: 68, w: 392, h: 392, lx: 830, ly: 470 },
      { n: 4, t: 'Meters', d: 'In, gain reduction, out. Values in the help strip.', x: 1188, y: 68, w: 84, h: 588, lx: 1000, ly: 600 },
      { n: 5, t: 'Character + Smart', d: 'How the stages move, and what adapts.', x: 12, y: 704, w: 310, h: 46, lx: 12, ly: 610 },
      { n: 6, t: 'Sidechain · stereo · detector', d: 'Comp’s own header buttons.', x: 754, y: 8, w: 150, h: 42, lx: 760, ly: 62 }
    ];

    return {
      th, presetName: V('empty') ? 'Init' : 'Vocal Leveller', presetDirty: V('smart') || V('create') ? ' •' : '', isPresets: V('presets') ? 'true' : 'false', presetBtn,
      snaps, headBtns,
      listenFrame: V('listen') ? 'inset 0 0 0 2px ' + th.sem.sc + ', inset 0 0 36px ' + hexA(th.sem.sc, 0.35) : 'none',
      displayAria: 'Comp display: 6 second level history with gain reduction, transfer curve with ' + stages.length + ' stage' + (stages.length === 1 ? '' : 's') + ', and meters',
      outColor, outFillA: V('delta') ? 0.3 : 0.12, strip, hGrid, inFill: inLine + ' L776 620 L0 620 Z', inLine, outLine, outFillP: outLine + ' L776 620 L0 620 Z',
      grEdge, grFillP: 'M0 0 ' + grEdge.slice(1).replace(/^/, 'L') + ' L776 0 Z', grEdge2: H2 ? lineOf(H2, (p) => grY(p.g)) : '',
      upEdge: hasUp ? upEdge : '', upFillP: hasUp ? upEdge + ' L776 620 L0 620 Z' : '', upPattern: key === 'cb' ? 'url(#upDots)' : 'transparent',
      cGrid, cDiag: 'M' + cx(-60) + ' ' + cy(-60) + ' L' + cx(0) + ' ' + cy(0), cCurve: cpath(curve),
      shadeDown: shade(V('create') ? shapeF : curve, true), shadeUp: shade(V('create') ? shapeF : curve, false), ghostCurve, trail,
      meterWells, mIn, mOut, mGr, mTarget, meterLabels, meterIcons, dbLabels, axisLabels,
      thrLines, hasTarget, target, diamonds, nodes, hasDot: !V('empty'), dot, grips, isEmpty: V('empty'), isListen: V('listen'), isDelta: V('delta'),
      hasStage: !!selStage, sp: spv, closePanel: () => this.setState({ sel: -1 }),
      hasWide: !!wp, wp: wp || { title: '', icon: '', iconC: accent, top: 0, w: 0, h: 0, isEq: false, isDials: false, side: [], knobs: [] }, sce,
      hasPop: V('stereo'), pop, hasMenu: !!menu, menu: menu || { aria: '', x: 0, y: 0, w: 0, items: [] },
      isHelp: V('help'), helpSpots, helpSlots, helpText,
      footDrops, latency: lat, latC: V('lookahead') ? th.accentText : th.hi, toggles, footDials
    };
  }
}
</script>
