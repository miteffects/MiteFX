<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mite Shape — component sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 1440px; height: 1620px; background: {{th.win}}; color: {{th.hi}}; font-family: Manrope, system-ui, sans-serif; font-size: 12px; overflow: hidden">
<div style="position: absolute; left: 56px; top: 40px; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Mite Shape · components</div>
<div style="position: absolute; left: 56px; top: 80px; font-size: 13px; color: {{th.mid}}">Additions for pass 5. The crossover bar and band regions are shared with Mite Multiband.</div>

<sc-for list="{{sections}}" as="s" hint-placeholder-count="7">
<section aria-label="{{s.t}}" style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; width: {{s.w}}px; height: {{s.h}}px; box-sizing: border-box; border-radius: 14px; background: {{th.surface}}; border: 1px solid {{th.line}}">
<div style="position: absolute; left: 20px; top: 16px; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: {{th.mid}}">{{s.t}}</div>
</section>
</sc-for>

<sc-for list="{{swatches}}" as="w" hint-placeholder-count="4">
<div style="position: absolute; left: {{w.x}}px; top: 150px; width: 150px; height: 120px; box-sizing: border-box; border-radius: 10px; background: {{w.bg}}; border: 1px solid {{w.b}}; padding: 12px">
<div style="width: 44px; height: 44px; border-radius: 10px; background: {{w.c}}; box-shadow: 0 0 14px {{w.glow}}"></div>
<div style="margin-top: 10px; font-size: 12px; font-weight: 700; color: {{w.fg}}">{{w.k}}</div>
<div style="font-feature-settings: 'tnum' 1; font-size: 11px; color: {{w.fg2}}">{{w.v}}</div>
</div>
</sc-for>
<div style="position: absolute; left: 720px; top: 146px; width: 640px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{colourNotes}}" as="n" hint-placeholder-count="4">
<div style="display: flex; gap: 10px; align-items: baseline"><span style="min-width: 150px; font-size: 12px; font-weight: 700">{{n.k}}</span><span style="font-size: 12px; line-height: 1.45; color: {{th.mid}}">{{n.v}}</span></div>
</sc-for>
</div>

<sc-for list="{{drawings}}" as="d" hint-placeholder-count="6">
<div role="img" aria-label="{{d.aria}}" style="position: absolute; left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.h}}px; border-radius: 8px; background: {{th.well}}; border: 1px solid {{th.wellB}}; overflow: hidden">
<svg width="{{d.w}}" height="{{d.h}}" viewBox="{{d.vb}}" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<defs><pattern id="hatch{{d.id}}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="{{th.lo}}" fill-opacity="0.3"></rect></pattern></defs>
<path d="{{d.p0.d}}" fill="{{d.p0.f}}" fill-opacity="{{d.p0.fo}}" stroke="{{d.p0.s}}" stroke-width="{{d.p0.sw}}" stroke-opacity="{{d.p0.so}}" stroke-dasharray="{{d.p0.da}}" style="filter: {{d.p0.gl}}"></path>
<path d="{{d.p1.d}}" fill="{{d.p1.f}}" fill-opacity="{{d.p1.fo}}" stroke="{{d.p1.s}}" stroke-width="{{d.p1.sw}}" stroke-opacity="{{d.p1.so}}" stroke-dasharray="{{d.p1.da}}" style="filter: {{d.p1.gl}}"></path>
<path d="{{d.p2.d}}" fill="{{d.p2.f}}" fill-opacity="{{d.p2.fo}}" stroke="{{d.p2.s}}" stroke-width="{{d.p2.sw}}" stroke-opacity="{{d.p2.so}}" stroke-dasharray="{{d.p2.da}}" style="filter: {{d.p2.gl}}"></path>
<path d="{{d.p3.d}}" fill="{{d.p3.f}}" fill-opacity="{{d.p3.fo}}" stroke="{{d.p3.s}}" stroke-width="{{d.p3.sw}}" stroke-opacity="{{d.p3.so}}" stroke-dasharray="{{d.p3.da}}" style="filter: {{d.p3.gl}}"></path>
<path d="{{d.p4.d}}" fill="{{d.p4.f}}" fill-opacity="{{d.p4.fo}}" stroke="{{d.p4.s}}" stroke-width="{{d.p4.sw}}" stroke-opacity="{{d.p4.so}}" stroke-dasharray="{{d.p4.da}}" style="filter: {{d.p4.gl}}"></path>
<path d="{{d.p5.d}}" fill="{{d.p5.f}}" fill-opacity="{{d.p5.fo}}" stroke="{{d.p5.s}}" stroke-width="{{d.p5.sw}}" stroke-opacity="{{d.p5.so}}" stroke-dasharray="{{d.p5.da}}" style="filter: {{d.p5.gl}}"></path>
<path d="{{d.p6.d}}" fill="{{d.p6.f}}" fill-opacity="{{d.p6.fo}}" stroke="{{d.p6.s}}" stroke-width="{{d.p6.sw}}" stroke-opacity="{{d.p6.so}}" stroke-dasharray="{{d.p6.da}}" style="filter: {{d.p6.gl}}"></path>
<path d="{{d.p7.d}}" fill="{{d.p7.f}}" fill-opacity="{{d.p7.fo}}" stroke="{{d.p7.s}}" stroke-width="{{d.p7.sw}}" stroke-opacity="{{d.p7.so}}" stroke-dasharray="{{d.p7.da}}" style="filter: {{d.p7.gl}}"></path>
<path d="{{d.p8.d}}" fill="{{d.p8.f}}" fill-opacity="{{d.p8.fo}}" stroke="{{d.p8.s}}" stroke-width="{{d.p8.sw}}" stroke-opacity="{{d.p8.so}}" stroke-dasharray="{{d.p8.da}}" style="filter: {{d.p8.gl}}"></path>
<path d="{{d.p9.d}}" fill="{{d.p9.f}}" fill-opacity="{{d.p9.fo}}" stroke="{{d.p9.s}}" stroke-width="{{d.p9.sw}}" stroke-opacity="{{d.p9.so}}" stroke-dasharray="{{d.p9.da}}" style="filter: {{d.p9.gl}}"></path>
<path d="{{d.p10.d}}" fill="{{d.p10.f}}" fill-opacity="{{d.p10.fo}}" stroke="{{d.p10.s}}" stroke-width="{{d.p10.sw}}" stroke-opacity="{{d.p10.so}}" stroke-dasharray="{{d.p10.da}}" style="filter: {{d.p10.gl}}"></path>
<path d="{{d.p11.d}}" fill="{{d.p11.f}}" fill-opacity="{{d.p11.fo}}" stroke="{{d.p11.s}}" stroke-width="{{d.p11.sw}}" stroke-opacity="{{d.p11.so}}" stroke-dasharray="{{d.p11.da}}" style="filter: {{d.p11.gl}}"></path>
<path d="{{d.p12.d}}" fill="{{d.p12.f}}" fill-opacity="{{d.p12.fo}}" stroke="{{d.p12.s}}" stroke-width="{{d.p12.sw}}" stroke-opacity="{{d.p12.so}}" stroke-dasharray="{{d.p12.da}}" style="filter: {{d.p12.gl}}"></path>
<path d="{{d.p13.d}}" fill="{{d.p13.f}}" fill-opacity="{{d.p13.fo}}" stroke="{{d.p13.s}}" stroke-width="{{d.p13.sw}}" stroke-opacity="{{d.p13.so}}" stroke-dasharray="{{d.p13.da}}" style="filter: {{d.p13.gl}}"></path>
</svg>
</div>
</sc-for>

<sc-for list="{{grips}}" as="g" hint-placeholder-count="6">
<span aria-hidden="true" style="position: absolute; left: {{g.x}}px; top: {{g.y}}px; width: 14px; height: 28px; box-sizing: border-box; border-radius: 7px; background: {{g.bg}}; border: 1.5px {{g.bs}} {{g.c}}; box-shadow: {{g.sh}}; opacity: {{g.op}}; transform: scale({{g.sc}}); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><span style="width: 4px; height: 1.5px; background: {{g.ink}}"></span><span style="width: 4px; height: 1.5px; background: {{g.ink}}"></span><span style="width: 4px; height: 1.5px; background: {{g.ink}}"></span></span>
</sc-for>
<sc-for list="{{badges}}" as="b" hint-placeholder-count="5">
<span aria-hidden="true" style="position: absolute; left: {{b.x}}px; top: {{b.y}}px; display: flex; gap: 4px; opacity: {{b.op}}"><span style="width: 18px; height: 18px; border-radius: 50%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; background: {{b.bg}}; color: {{b.fg}}; border: {{b.ring}}; box-shadow: {{b.sh}}">{{b.n}}</span><sc-if value="{{b.hasTag}}" hint-placeholder-val="{{ false }}"><span style="height: 18px; min-width: 18px; box-sizing: border-box; padding: 0 4px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; background: {{b.tagBg}}; color: {{th.nodeInk}}">{{b.tag}}</span></sc-if></span>
</sc-for>
<sc-for list="{{dots}}" as="h" hint-placeholder-count="0">
<span aria-hidden="true" style="position: absolute; left: {{h.x}}px; top: {{h.y}}px; width: {{h.w}}px; height: {{h.h}}px; border-radius: {{h.r}}px; box-sizing: border-box; background: {{th.accent}}; border: 2px solid {{th.needle}}; box-shadow: 0 0 10px {{th.accent}}"></span>
</sc-for>
<sc-for list="{{labels}}" as="l" hint-placeholder-count="10">
<span style="position: absolute; left: {{l.x}}px; top: {{l.y}}px; width: {{l.w}}px; text-align: {{l.al}}; font-feature-settings: 'tnum' 1; font-size: {{l.fs}}px; font-weight: {{l.fw}}; letter-spacing: {{l.ls}}; color: {{l.c}}; line-height: 1.4">{{l.t}}</span>
</sc-for>

<sc-for list="{{dials}}" as="k" hint-placeholder-count="8">
<div style="position: absolute; left: {{k.x}}px; top: {{k.y}}px; width: 96px; display: flex; flex-direction: column; align-items: center; gap: 3px">
<span style="position: relative; width: 62px; height: 62px; display: block">
<svg width="62" height="62" viewBox="0 0 64 64" fill="none" aria-hidden="true" style="position: absolute; left: 0; top: 0; overflow: visible">
<path d="{{k.dim}}" stroke="{{th.tickOff}}" stroke-width="2" stroke-linecap="round"></path>
<path d="{{k.ctr}}" stroke="{{th.mid}}" stroke-width="2" stroke-linecap="round"></path>
<path d="{{k.lit}}" stroke="{{th.accent}}" stroke-width="2" stroke-linecap="round" style="filter: drop-shadow(0 0 2px {{th.accent}})"></path>
<circle cx="32" cy="32" r="19.5" fill="{{th.disc}}" stroke="{{th.discB}}" style="filter: drop-shadow(0 2px 3px rgba(0,0,0,0.7))"></circle>
<path d="{{k.ptr}}" stroke="{{th.needle}}" stroke-width="2.5" stroke-linecap="round" style="filter: drop-shadow(0 0 3px {{th.accent}})"></path>
</svg>
<span style="position: absolute; left: 0; top: 0; width: 62px; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1"><span style="font-size: 12px; font-weight: 700; font-feature-settings: 'tnum' 1; color: {{th.strong}}">{{k.n}}</span><span style="font-size: 9px; font-weight: 600; color: {{th.lo}}; margin-top: 2px">dB</span></span>
</span>
<span style="font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: {{th.lo}}">{{k.label}}</span>
</div>
</sc-for>

<sc-for list="{{glyphs}}" as="g" hint-placeholder-count="12">
<div style="position: absolute; left: {{g.x}}px; top: {{g.y}}px; width: 96px; display: flex; flex-direction: column; align-items: center; gap: 8px">
<span style="width: 44px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: {{g.bg}}; border: 1px solid {{g.b}}; box-shadow: {{g.sh}}; font-size: 13px; font-weight: 800; color: {{g.fg}}"><sc-if value="{{g.isText}}" hint-placeholder-val="{{ false }}">{{g.t}}</sc-if><sc-if value="{{g.isIcon}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="{{g.d}}" stroke="{{g.fg}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="filter: {{g.glow}}"></path></svg></sc-if></span>
<span style="font-size: 11px; color: {{th.mid}}; text-align: center">{{g.k}}</span>
</div>
</sc-for>
</div>
</x-dc>

    const edge = (f) => gpts.map((p, i) => (i ? 'L' : 'M') + gx(i) + ' ' + gy(f(p))).join(' ');
    let ticks = ''; gpts.forEach((p, i) => { if (p.hit) ticks += 'M' + gx(i) + ' 20 V' + r1(24 + 10 * p.hit) + ' '; });
    drawings.push(drawing(GX, GY, GW, GH, [
      P('M0 20.5 H' + GW, { s: th.line }), P('M0 ' + gz + ' H' + GW, { s: th.zero, sw: 1.2 }), P('M0 ' + gy(6) + ' H' + GW + ' M0 ' + gy(-6) + ' H' + GW, { s: th.gridMinor }),
      P(area((p) => Math.max(0, p.g)), { f: th.up, fo: 0.28 }), P(area((p) => Math.max(0, p.g) * p.w), { f: th.up, fo: 0.7, gl: glow(th.up) }),
      P(area((p) => Math.min(0, p.g)), { f: th.gr, fo: 0.28 }), P(area((p) => Math.min(0, p.g) * p.w), { f: th.gr, fo: 0.7, gl: glow(th.gr) }),
      P(edge((p) => Math.max(0, p.g)), { s: th.up, sw: 1.5 }), P(edge((p) => Math.min(0, p.g)), { s: th.gr, sw: 1.5 }),
      P(edge((p) => p.g2), { s: th.hi, so: 0.85, sw: 1.3, da: '4 3' }), P(ticks, { s: accent, sw: 2, gl: glow(accent) })
    ], 'Signed gain trace: attack +6 dB spikes at each hit, sustain −4 dB shelf after, a dashed second channel, and hit ticks'));
    const glegend = [
      ['Attack part', 'gain × w, 70 % fill with glow: the detector is inside its transient time', th.up],
      ['Sustain part', 'the rest of the gain, 28 % fill and a 1.5 px edge, no glow', th.gr],
      ['Hit tick', 'on the lane divider; height = sharpness (lead 3 → 12 dB maps 25 → 100 %)', accent],
      ['Second channel', 'dashed edge in text.hi (R or S) when link is below 100 %', th.hi]
    ];
    glegend.forEach(([k, v, c], i) => { labels.push(L(1090, 676 + i * 52, k, { w: 290, fw: 700, fs: 12, c })); labels.push(L(1090, 694 + i * 52, v, { w: 290 })); });
    labels.push(L(GX, GY + GH + 10, 'Boost rises from the 0 dB line in gainUp, cut hangs in gr, 5 px per dB with a soft clamp at ±11.5 dB. Sign is never shown by colour alone: it is also up versus down.', { w: 1000, fs: 12 }));
    [0.3, 0.6, 1].forEach((sh, i) => { const x = GX + 120 + i * 90; drawings.push(drawing(x, GY + GH + 40, 60, 30, [P('M0 6.5 H60', { s: th.line }), P('M30 6 V' + r1(10 + 10 * sh), { s: accent, sw: 2, gl: glow(accent) })], 'Hit tick at sharpness ' + Math.round(sh * 100) + ' %')); labels.push(L(x + 66, GY + GH + 46, Math.round(sh * 100) + ' %', { w: 40 })); });
    labels.push(L(GX, GY + GH + 46, 'Hit marker', { w: 100, fw: 700, c: th.hi }));

    // ---- scopes
    const scope = (b, W, H, x, y, handles, big, aria) => {
      const TM = 400, pad = 6, n = 160, sx = (tm) => pad + (W - 2 * pad) * Math.sqrt(clamp(tm, 0, TM) / TM);
      const z = H * 0.56, kk = (H * 0.40) / 12, yG = (g) => z - clamp(g, -12, 12) * kk, yL = (db) => 4 + (-clamp(db, -48, 0) / 48) * (H - 8);
      const Wd2 = Math.max(1.5, b.T * b.tr / 100), wv = (tm) => 1 - smooth((tm - (b.T - Wd2 / 2)) / Wd2), g = (tm) => b.a * wv(tm) + b.s * (1 - wv(tm));
      const lvl = (tm) => 20 * Math.log10(0.5 * Math.exp(-tm / 120) + 0.008);
      const ts = []; for (let i = 0; i <= n; i++) ts.push(TM * Math.pow(i / n, 2));
      const ar = (f) => 'M' + pad + ' ' + r1(z) + ' ' + ts.map((tm) => 'L' + r1(sx(tm)) + ' ' + r1(yG(f(tm)))).join(' ') + ' L' + (W - pad) + ' ' + r1(z) + ' Z';
      const x0 = sx(Math.max(0, b.T - Wd2 / 2)), x1 = sx(b.T + Wd2 / 2), xT = sx(b.T);
      drawings.push(drawing(x, y, W, H, [
        P([1, 10, 50, 200].map((m) => 'M' + r1(sx(m)) + ' 0 V' + H).join(' '), { s: th.gridMinor }),
        P('M' + r1(x0) + ' 0 H' + r1(x1) + ' V' + H + ' H' + r1(x0) + ' Z', { f: accent, fo: 0.12 }),
        P('M' + pad + ' ' + H + ' ' + ts.map((tm) => 'L' + r1(sx(tm)) + ' ' + r1(yL(lvl(tm)))).join(' ') + ' L' + (W - pad) + ' ' + H + ' Z', { f: th.pre, fo: 0.12 }),
        P(ts.map((tm, i) => (i ? 'L' : 'M') + r1(sx(tm)) + ' ' + r1(yL(lvl(tm) + g(tm)))).join(' '), { s: th.mid, so: 0.55 }),
        P('M0 ' + r1(z) + ' H' + W, { s: th.zero }),
        P(ar((tm) => Math.max(0, g(tm))), { f: th.up, fo: 0.28 }), P(ar((tm) => Math.max(0, g(tm)) * wv(tm)), { f: th.up, fo: 0.65 }),
        P(ar((tm) => Math.min(0, g(tm))), { f: th.gr, fo: 0.28 }), P(ar((tm) => Math.min(0, g(tm)) * wv(tm)), { f: th.gr, fo: 0.65 }),
        P('M' + r1(xT) + ' 0 V' + H, { s: accent, sw: 1.2, da: '3 3' }),
        P(ts.map((tm, i) => (i ? 'L' : 'M') + r1(sx(tm)) + ' ' + r1(yG(g(tm)))).join(' '), { s: th.curve, sw: big ? 2.4 : 2, gl: glow(th.curve) })
      ], aria));
      if (handles) {
        const ta = Math.max(0.6, (b.T - Wd2 / 2) * 0.45), tsu = b.T + Wd2 / 2 + (TM - b.T) * 0.3;
        dots.push({ x: r1(x + sx(ta) - 6), y: r1(y + yG(b.a) - 6), w: 12, h: 12, r: 6 }, { x: r1(x + sx(tsu) - 6), y: r1(y + yG(b.s) - 6), w: 12, h: 12, r: 6 }, { x: r1(x + xT - 4), y: y + H - 22, w: 8, h: 18, r: 4 });
        return { sx, yG, xT, x0, x1, ta, tsu };
      }
      return null;
    };
    const SB = { a: 5, s: -3, T: 30, tr: 100 };
    const geoB = scope(SB, 520, 220, 60, 966, true, true, 'Transient scope, band panel size, attack +5 dB, sustain −3 dB, 30 ms, transition 100 %');
    labels.push(L(60 + geoB.sx(geoB.ta) - 30, 966 + geoB.yG(5) - 30, 'attack: drag ↕', { w: 120, fw: 700, c: th.hi }));
    labels.push(L(60 + geoB.sx(geoB.tsu) - 30, 966 + geoB.yG(-3) + 12, 'sustain: drag ↕', { w: 120, fw: 700, c: th.hi }));
    labels.push(L(60 + geoB.xT + 8, 966 + 8, 'transient time: drag ↔', { w: 160, fw: 700, c: th.accentText }));
    labels.push(L(60 + geoB.x0 - 60, 966 + 178, 'transition: Alt-drag', { w: 140, fw: 700, c: th.accentText }));
    [[1, '1'], [10, '10'], [50, '50'], [200, '200 ms']].forEach(([m, s2]) => labels.push(L(60 + geoB.sx(m) + 3, 966 + 204, s2, { w: 60, fs: 10, c: th.lo })));
    scope({ a: 3, s: -6, T: 40, tr: 80 }, 240, 112, 620, 966, false, false, 'Transient scope, card size');
    labels.push(L(620, 1084, 'Card · 3 bands', { w: 200, fw: 700, c: th.hi }));
    scope({ a: -3, s: -2, T: 15, tr: 120 }, 106, 80, 880, 966, false, false, 'Transient scope, smallest card size');
    labels.push(L(880, 1052, 'Card · 5 bands', { w: 120, fw: 700, c: th.hi }));
    scope({ a: 0, s: 0, T: 25, tr: 100 }, 240, 112, 1020, 966, false, false, 'Transient scope at zero: a flat line on 0 dB');
    labels.push(L(1020, 1084, 'Init · flat on 0 dB', { w: 200, fw: 700, c: th.hi }));
    labels.push(L(620, 1120, 'The scope is the same function the DSP runs, fed a test hit (−6 dBFS, 120 ms decay). Square-root time puts the first 10 ms on a quarter of the width, so attack and transition are always visible. The white line is the gain; fills are split into attack and sustain exactly as in the history.', { w: 740, fs: 12 }));
    labels.push(L(620, 1190, 'Handles: attack dot sits 45 % into the attack part, sustain dot 30 % into the tail; the handover pill sits on the dashed line at the bottom edge. Each has a 28 px button (32 px on touch).', { w: 740, fs: 12 }));

    // ---- dials
    const polar = (deg, r) => { const an = (deg - 90) * Math.PI / 180; return [32 + r * Math.cos(an), 32 + r * Math.sin(an)]; };
    const tk = (deg, ra, rb) => { const [x0, y0] = polar(deg, ra), [x1, y1] = polar(deg, rb); return 'M' + r1(x0) + ' ' + r1(y0) + ' L' + r1(x1) + ' ' + r1(y1) + ' '; };
    const geo = (frac) => { const fr = clamp(frac, 0, 1), dv = -135 + 270 * fr; let lit = '', dim = ''; for (let i = 0; i < 31; i++) { const d = -135 + i * 9; const s2 = tk(d, 25, 29); const on = d >= Math.min(0, dv) - 0.01 && d <= Math.max(0, dv) + 0.01; if (on) lit += s2; else dim += s2; } return { lit, dim, ctr: tk(0, 22.5, 30), ptr: tk(dv, 21.5, 31) }; };
    const amtFrac = (v) => { const av = Math.abs(v), m = av <= 6 ? 0.6 * av / 6 : 0.6 + 0.4 * (av - 6) / 12; return 0.5 + 0.5 * Math.sign(v) * m; };
    const dials = [-18, -6, -3, 0, 2, 6, 12, 18].map((v, i) => Object.assign({ x: 60 + i * 98, y: 1318, n: dbN(v), label: i < 4 ? 'SUSTAIN' : 'ATTACK' }, geo(amtFrac(v))));

    // ---- glyphs
    const G = {
      mute: 'M4 9.5 H7.5 L12 5.5 V18.5 L7.5 14.5 H4 Z M15.5 9.5 L20.5 14.5 M20.5 9.5 L15.5 14.5', bin: 'M5 7 H19 M10 7 V5 H14 V7 M7 7 L8 20 H16 L17 7 M10.5 10.5 V16.5 M13.5 10.5 V16.5',
      merge: 'M4 6 C10 6 11 12 20 12 M4 18 C10 18 11 12 20 12 M17 9 L20 12 L17 15', lr4: 'M3 7 H8 C12 7 13 17 21 17 M3 17 C11 17 12 7 16 7 H21', clip: 'M3 18 H7 C10 18 10.5 6 14 6 H21 M3 6 H21',
      listen: 'M4 14 V12 a8 8 0 0 1 16 0 V14 M4 14 h3 v6 h-3 Z M20 14 h-3 v6 h3 Z', delta: 'M12 4 L20.5 19 H3.5 Z', auto: 'M3 16 H21 M6.5 16 C9 16 10 7.5 12 7.5 C14 7.5 15 16 17.5 16 M12 3.5 V6',
      sliders: 'M4 7 H20 M4 12 H20 M4 17 H20 M8.5 5 V9 M15 10 V14 M10.5 15 V19', ms: 'M12 4 a8 8 0 1 0 .01 0 M12 9.5 a2.5 2.5 0 1 0 .01 0', copy: 'M8 8 H19 V20 H8 Z M5 16 V4 H15'
    };
    const gb = (on, c) => on ? { bg: hexA(c, 0.16), b: c, sh: '0 0 12px ' + hexA(c, 0.35), fg: c, glow: glow(c) } : { bg: th.pCtl, b: th.pCtlB, sh: 'none', fg: th.mid, glow: 'none' };
    const gl = [['Solo', '', 'S', true, th.needle], ['Mute', G.mute, '', true, th.hi], ['Remove band', G.bin, '', false], ['Merge', G.merge, '', false], ['LR4 crossover', G.lr4, '', false], ['Clip (later)', G.clip, '', true, accent],
      ['Listen detector', G.listen, '', true, th.sc], ['Delta', G.delta, '', true, accent], ['Auto gain', G.auto, '', false], ['Detector', G.sliders, '', false], ['Mid / Side', G.ms, '', true, accent], ['Copy settings', G.copy, '', false]];
    const glyphs = gl.map(([k, d, t2, on, c], i) => Object.assign({ x: 900 + (i % 5) * 98, y: 1318 + Math.floor(i / 5) * 92, k, d, t: t2, isText: !!t2, isIcon: !t2 }, gb(on, c || accent)));
    labels.push(L(60, 1508, 'Solo is the letter S (the system’s solo badge); every other control is an icon. Lit states use the owner’s colour: white for solo, text.hi for mute, sidechain violet for Listen, leaf for the rest. Bin and × keep 8 px clear around them.', { w: 780, fs: 12 }));

    return { th, sections, swatches, colourNotes, drawings, grips, badges, dots, labels, dials, glyphs };
  }
}
</script>
